  <style>

      display: flex;
      flex-direction: column;
    }
    
    .article-card:hover {
      border-color: var(--primary-cyan, #00d9ff);
      box-shadow: 0 4px 20px rgba(0, 217, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .article-meta {
      display: flex;

      margin-bottom: 1rem;

    .article-date {

    }
    
    .article-type {
      padding: 0.2rem 0.6rem;
      background: rgba(0, 217, 255, 0.1);
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .article-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: #fff;
      line-height: 1.4;
    }
    
    .article-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .article-title a:hover {

    .article-excerpt {

    .article-tags {

      gap: 0.5rem;

    .tag {
      padding: 0.3rem 0.6rem;
      background: rgba(255, 0, 110, 0.1);
      border: 1px solid rgba(255, 0, 110, 0.3);

    @media (max-width: 768px) {
      .filter-bar {
        flex-direction: column;

<body>
  <div class="header-section">
    <div class="header-content">
      <h1><span aria-hidden="true">📰</span> Riksdagsmonitor Nachrichten</h1>
      <p class="subtitle">Politischer Journalismus im Stil des Economist • Systematische Transparenz • Demokratische Rechenschaftspflicht</p>
    </div>
  </div>
  
  <div class="container">
    <a href="../index_de.html" class="back-link">← Zurück zum Dashboard</a>
    
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-type">Artikeltyp</label>
        <select id="filter-type">
          <option value="all">Alle Typen</option>
          <option value="retrospective">Retrospektiv</option>
          <option value="prospective">Prospektiv (Kommende Woche)</option>
          <option value="analysis">Analyse</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-topic">Thema</label>
        <select id="filter-topic">
          <option value="all">Alle Themen</option>
          <option value="eu">EU-Angelegenheiten</option>
          <option value="government">Regierung</option>
          <option value="parliament">Parlament</option>
          <option value="committees">Ausschüsse</option>
          <option value="legislation">Gesetzgebung</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-sort">Sortieren nach</label>
        <select id="filter-sort">
          <option value="date-desc">Neueste zuerst</option>
          <option value="date-asc">Älteste zuerst</option>
          <option value="title">Titel A-Z</option>
        </select>
      </div>
    </div>
    
    <div class="articles-grid" id="articles-grid">
      <!-- Articles dynamically loaded via JavaScript -->
    </div>
    
    <div class="no-results" id="no-results" style="display: none;">
      <p>Keine Artikel gefunden, die Ihren Filtern entsprechen.</p>
    </div>
  </div>
  
  <script>
    // News articles metadata
    const articles = [
      {
        title: "Week Ahead: Brussels Summit Tests Swedish EU Strategy",
        date: "2026-02-10",
        type: "prospective",
        slug: "2026-02-10-week-ahead-feb-10-17-en.html",
        excerpt: "Critical week for Swedish European policy as PM Kristersson attends informal leaders summit while EU Committee follows up on defense and economic issues.",
        topics: ["eu", "defense", "parliament", "citizenship", "environment"],
        tags: ["EU Summit", "Brussels", "Defense Policy", "Parliamentary Oversight"]
      },
      {
        title: "Prime Minister Faces Parliament Before Brussels Summit",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-pm-eu-summit-en.html",
        excerpt: "In rare open EU Committee meeting, PM Ulf Kristersson consults Riksdag before informal leaders summit while government confronts mounting pressure on economic crime and citizenship policy.",
        topics: ["eu", "government", "parliament"],
        tags: ["EU", "Prime Minister", "Economic Crime", "Citizenship"]
      },
      {
        title: "Biodiversity Strategy and Citizenship Reform Announced",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-biodiversity-citizenship-en.html",
        excerpt: "Government announces comprehensive biodiversity strategy and signals major citizenship reform as coalition navigates competing priorities on environment and immigration.",
        topics: ["environment", "government", "legislation"],
        tags: ["Biodiversity", "Citizenship", "Environment", "Immigration"]
      },
      {
        title: "Government Propositions February 2026",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-government-propositions-en.html",
        excerpt: "Policy offensive across financial supervision, renewable energy, and property security marks intensive legislative push before spring recess.",
        topics: ["government", "legislation", "parliament"],
        tags: ["Propositions", "Finance", "Climate", "Property", "Tax"]
      },
      {
        title: "Committee Reports February 2026",
        date: "2026-02-06",
        type: "analysis",
        slug: "2026-02-committee-reports-en.html",
        excerpt: "Parliamentary committees deliver comprehensive reports spanning education, defense, and social policy as Riksdag enters critical decision phase.",
        topics: ["committees", "parliament"],
        tags: ["Committee Reports", "Education", "Defense", "Social Policy"]
      },
      {
        title: "Opposition Motions February 2026",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-opposition-motions-en.html",
        excerpt: "Opposition parties intensify legislative pressure with comprehensive motion packages targeting government policy across economic crime, healthcare, and climate.",
        topics: ["parliament", "legislation"],
        tags: ["Opposition", "Motions", "Economic Crime", "Healthcare"]
      },
      {
        title: "Parliament Agenda - Week Overview",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-parliament-agenda-en.html",
        excerpt: "Comprehensive preview of upcoming parliamentary activity including committee meetings, chamber debates, and ministerial questions.",
        topics: ["parliament"],
        tags: ["Parliament", "Agenda", "Weekly Preview"]
      },
      {
        title: "The Week Ahead",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-week-ahead-en.html",
        excerpt: "Looking ahead at key political developments, parliamentary activity, and government decisions in the coming week.",
        topics: ["parliament", "government"],
        tags: ["Week Ahead", "Preview", "Political Calendar"]
      }
    ];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${article.type}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('de-DE', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>
