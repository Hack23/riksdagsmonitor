<body class="news-page">
  <header class="header-section">
    <div class="header-content">
      <h1>Nachrichten</h1>
      <p class="subtitle">Neueste Nachrichten und Analysen aus dem schwedischen Reichstag. Politischer Journalismus im Stil des Economist.</p>
      <a href="../index_de.html" class="back-link">← Zurück zur Hauptseite</a>
    </div>
  </header>
  
  <div class="container">

    
    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-type">Typ:</label>
        <select id="filter-type">
          <option value="all">Alle Typen</option>
          <option value="prospective">Vorausschauend</option>
          <option value="retrospective">Rückblickend</option>
          <option value="analysis">Analyse</option>
          <option value="breaking">Eilmeldungen</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-topic">Thema:</label>
        <select id="filter-topic">
          <option value="all">Alle Themen</option>
          <option value="parliament">Parlament</option>
          <option value="government">Regierung</option>
          <option value="eu">EU</option>
          <option value="defense">Verteidigung</option>
          <option value="environment">Umwelt</option>
          <option value="committees">Ausschüsse</option>
          <option value="legislation">Gesetzgebung</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-sort">Sortieren:</label>
        <select id="filter-sort">
          <option value="date-desc">Neueste zuerst</option>
          <option value="date-asc">Älteste zuerst</option>
          <option value="title">Titel</option>
        </select>
      </div>
    </div>
    
    <!-- Articles Grid -->
    <div class="articles-grid" id="articles-grid"></div>
    
    <div id="no-results" style="display: none; text-align: center; padding: 3rem; color: #888;">
      Keine Artikel entsprachen den Filtern
    </div>
  </div>
  
  <script>
    // Dynamic articles array - generated from news/ directory
    const articles = [
  {
    "title": "Schwedens Riksdag in der Frühjahrspaüse: Eine Halbzeitbewertung der Gesetzgebungsbilanz der Tidö-Regierung",
    "date": "2026-02-13T18:00:00.000Z",
    "type": "retrospective",
    "slug": "2026-02-13-evening-analysis-de.html",
    "excerpt": "Mit 2.308 gemeldeten Regelverstößen unter 2.494 überwachten Politikern offenbart die Parlamentssitzung eine Regierung, die Koalitionsarithmetik nur schwer in legislativen Schwung umsetzen kann",
    "topics": [
      "parliament",
      "government"
    ],
    "tags": [
      "Riksdag",
      "Coalition Government",
      "Legislative Analysis",
      "Tidö Agreement"
    ]
  }
];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${localizeType(article.type)}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    const typeLabels = {"prospective":"Vorausschauend","retrospective":"Rückblickend","analysis":"Analyse","breaking":"Eilmeldungen"};
    
    function localizeType(type) {
      return typeLabels[type] || type;
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('de', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>

  <!-- Dynamic Content Loader -->
  <script>
    // Localization data
    const i18n = {
      noArticles: 'Keine Artikel verfügbar',
      loading: 'Artikel werden geladen...',
      articleCount: (n) => n === 1 ? '1 Artikel' : '' + n + ' Artikel'
    };
    
    // Dynamic content loader
    document.addEventListener('DOMContentLoaded', () => {
      const articlesGrid = document.querySelector('.articles-grid');
      if (!articlesGrid) return;
      
      const articleCards = articlesGrid.querySelectorAll('.article-card');
      const articleCount = articleCards.length;
      
      // Update article count if element exists
      const countElement = document.querySelector('.article-count');
      if (countElement) {
        countElement.textContent = i18n.articleCount(articleCount);
      }
      
      // Show no articles message if empty
      if (articleCount === 0) {
        articlesGrid.innerHTML = `<p class="no-articles">${i18n.noArticles}</p>`;
      }
    });
  </script>
