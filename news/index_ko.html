  <script>
    // News articles metadata
    const articles = [

        topics: ["eu", "defense", "parliament", "citizenship", "environment"],

      {

        slug: "2026-02-10-pm-eu-summit-en.html",

        topics: ["eu", "government", "parliament"],

      },
      {
        title: "생물다양성 전략 및 시민권 개혁 발표",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-biodiversity-citizenship-en.html",
        excerpt: "정부가 환경과 이민에 대한 경쟁 우선순위를 조율하면서 포괄적인 생물다양성 전략을 발표하고 주요 시민권 개혁을 시사합니다.",
        topics: ["environment", "government", "legislation"],
        tags: ["생물다양성", "시민권", "환경", "이민"]
      },
      {
        title: "정부 제안서 2026년 2월",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-government-propositions-en.html",
        excerpt: "금융 감독, 재생 에너지, 재산 보호에 걸친 정책 공세가 봄 휴회 전 집중적인 입법 추진을 표시합니다.",
        topics: ["government", "legislation", "parliament"],
        tags: ["제안서", "금융", "기후", "재산", "세금"]
      },
      {
        title: "위원회 보고서 2026년 2월",
        date: "2026-02-06",
        type: "analysis",
        slug: "2026-02-committee-reports-en.html",
        excerpt: "의회 위원회가 교육, 국방, 사회 정책에 걸친 포괄적인 보고서를 제출하면서 릭스다그가 중요한 결정 단계에 진입합니다.",
        topics: ["committees", "parliament"],
        tags: ["위원회 보고서", "교육", "국방", "사회 정책"]
      },
      {
        title: "야당 발의안 2026년 2월",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-opposition-motions-en.html",
        excerpt: "야당이 경제 범죄, 의료, 기후에 걸친 정부 정책을 겨냥한 포괄적인 발의안 패키지로 입법 압력을 강화합니다.",
        topics: ["parliament", "legislation"],
        tags: ["야당", "발의안", "경제 범죄", "의료"]
      },
      {
        title: "의회 의제 - 주간 개요",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-parliament-agenda-en.html",
        excerpt: "위원회 회의, 본회의 토론, 장관 질의를 포함한 향후 의회 활동의 포괄적인 미리보기.",
        topics: ["parliament"],
        tags: ["의회", "의제", "주간 미리보기"]
      },
      {
        title: "다음 주 전망",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-week-ahead-en.html",
        excerpt: "앞으로 한 주간의 주요 정치 발전, 의회 활동, 정부 결정에 대한 전망.",
        topics: ["parliament", "government"],
        tags: ["다음 주", "미리보기", "정치 일정"]
      }
    ];
    
    // Localized type labels
    const typeLabels = {
      'prospective': '전망 (다음 주)',
      'retrospective': '회고',
      'analysis': '분석'
    };
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${typeLabels[article.type] || article.type}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      return `${year}년 ${month}월 ${day}일`;
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>
</body>
