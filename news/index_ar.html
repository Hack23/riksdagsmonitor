<body>

  <script>
    // News articles metadata
    const articles = [
      {
        title: "الأسبوع القادم: قمة بروكسل تختبر الاستراتيجية السويدية للاتحاد الأوروبي",
        date: "2026-02-10",
        type: "prospective",
        slug: "2026-02-10-week-ahead-feb-10-17-en.html",
        excerpt: "أسبوع حاسم للسياسة الأوروبية السويدية حيث يحضر رئيس الوزراء كريسترسون قمة القادة غير الرسمية بينما تتابع لجنة الاتحاد الأوروبي قضايا الدفاع والاقتصاد.",
        topics: ["eu", "defense", "parliament", "citizenship", "environment"],
        tags: ["قمة الاتحاد الأوروبي", "بروكسل", "سياسة الدفاع", "الرقابة البرلمانية"]
      },
      {
        title: "رئيس الوزراء يواجه البرلمان قبل قمة بروكسل",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-pm-eu-summit-en.html",
        excerpt: "في اجتماع مفتوح نادر للجنة الاتحاد الأوروبي، يستشير رئيس الوزراء أولف كريسترسون البرلمان قبل قمة القادة غير الرسمية بينما تواجه الحكومة ضغوطاً متزايدة بشأن الجريمة الاقتصادية وسياسة الجنسية.",
        topics: ["eu", "government", "parliament"],
        tags: ["الاتحاد الأوروبي", "رئيس الوزراء", "الجريمة الاقتصادية", "الجنسية"]
      },
      {
        title: "الإعلان عن استراتيجية التنوع البيولوجي وإصلاح الجنسية",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-biodiversity-citizenship-en.html",
        excerpt: "تعلن الحكومة عن استراتيجية شاملة للتنوع البيولوجي وتشير إلى إصلاح كبير للجنسية حيث يتنقل الائتلاف بين الأولويات المتنافسة بشأن البيئة والهجرة.",
        topics: ["environment", "government", "legislation"],
        tags: ["التنوع البيولوجي", "الجنسية", "البيئة", "الهجرة"]
      },
      {
        title: "مقترحات الحكومة فبراير 2026",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-government-propositions-en.html",
        excerpt: "هجوم سياسي عبر الإشراف المالي والطاقة المتجددة وأمن الملكية يمثل دفعة تشريعية مكثفة قبل العطلة الربيعية.",
        topics: ["government", "legislation", "parliament"],
        tags: ["المقترحات", "المالية", "المناخ", "الملكية", "الضرائب"]
      },
      {
        title: "تقارير اللجان فبراير 2026",
        date: "2026-02-06",
        type: "analysis",
        slug: "2026-02-committee-reports-en.html",
        excerpt: "تقدم اللجان البرلمانية تقارير شاملة تغطي التعليم والدفاع والسياسة الاجتماعية حيث يدخل البرلمان مرحلة القرار الحاسمة.",
        topics: ["committees", "parliament"],
        tags: ["تقارير اللجان", "التعليم", "الدفاع", "السياسة الاجتماعية"]
      },
      {
        title: "مقترحات المعارضة فبراير 2026",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-opposition-motions-en.html",
        excerpt: "تكثف أحزاب المعارضة الضغط التشريعي بحزم مقترحات شاملة تستهدف السياسة الحكومية عبر الجريمة الاقتصادية والرعاية الصحية والمناخ.",
        topics: ["parliament", "legislation"],
        tags: ["المعارضة", "المقترحات", "الجريمة الاقتصادية", "الرعاية الصحية"]
      },
      {
        title: "جدول أعمال البرلمان - نظرة عامة على الأسبوع",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-parliament-agenda-en.html",
        excerpt: "معاينة شاملة للنشاط البرلماني القادم بما في ذلك اجتماعات اللجان ومناقشات الجلسة العامة وأسئلة الوزراء.",
        topics: ["parliament"],
        tags: ["البرلمان", "جدول الأعمال", "معاينة أسبوعية"]
      },
      {
        title: "الأسبوع القادم",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-week-ahead-en.html",
        excerpt: "نظرة مستقبلية على التطورات السياسية الرئيسية والنشاط البرلماني وقرارات الحكومة في الأسبوع المقبل.",
        topics: ["parliament", "government"],
        tags: ["الأسبوع القادم", "معاينة", "التقويم السياسي"]
      }
    ];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${article.type}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title, 'ar'));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>
</body>
