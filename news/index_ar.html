<body class="news-page">
  <header class="header-section">
    <div class="header-content">
      <h1>أخبار</h1>
      <p class="subtitle">آخر الأخبار والتحليلات من البرلمان السويدي. صحافة سياسية على طراز ذا إيكونوميست.</p>
      <a href="../index_ar.html" class="back-link">← العودة إلى الصفحة الرئيسية</a>
    </div>
  </header>
  
  <div class="container">

    
    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-type">النوع:</label>
        <select id="filter-type">
          <option value="all">جميع الأنواع</option>
          <option value="prospective">استشرافي</option>
          <option value="retrospective">استعادي</option>
          <option value="analysis">تحليل</option>
          <option value="breaking">أخبار عاجلة</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-topic">الموضوع:</label>
        <select id="filter-topic">
          <option value="all">جميع المواضيع</option>
          <option value="parliament">البرلمان</option>
          <option value="government">الحكومة</option>
          <option value="eu">EU</option>
          <option value="defense">الدفاع</option>
          <option value="environment">البيئة</option>
          <option value="committees">اللجان</option>
          <option value="legislation">التشريعات</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-sort">الترتيب:</label>
        <select id="filter-sort">
          <option value="date-desc">الأحدث أولاً</option>
          <option value="date-asc">الأقدم أولاً</option>
          <option value="title">العنوان</option>
        </select>
      </div>
    </div>
    
    <!-- Articles Grid -->
    <div class="articles-grid" id="articles-grid"></div>
    
    <div id="no-results" style="display: none; text-align: center; padding: 3rem; color: #888;">
      لا توجد مقالات تطابق الفلاتر
    </div>
  </div>
  
  <script>
    // Dynamic articles array - generated from news/ directory
    const articles = [
  {
    "title": "البرلمان السويدي في عطلة الربيع: تقييم نصف الدورة للسجل التشريعي لحكومة تيدو",
    "date": "2026-02-13T18:00:00.000Z",
    "type": "retrospective",
    "slug": "2026-02-13-evening-analysis-ar.html",
    "excerpt": "مع الإبلاغ عن 2,308 انتهاك للقواعد بين 2,494 سياسيًا مراقبًا، تكشف الدورة البرلمانية عن حكومة تكافح لتحويل حسابات الائتلاف إلى زخم تشريعي",
    "topics": [
      "parliament",
      "government"
    ],
    "tags": [
      "Riksdag",
      "Coalition Government",
      "Legislative Analysis",
      "Tidö Agreement"
    ]
  }
];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${localizeType(article.type)}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    const typeLabels = {"prospective":"استشرافي","retrospective":"استعادي","analysis":"تحليل","breaking":"أخبار عاجلة"};
    
    function localizeType(type) {
      return typeLabels[type] || type;
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('ar', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>

  <!-- Dynamic Content Loader -->
  <script>
    // Localization data
    const i18n = {
      noArticles: 'لا توجد مقالات متاحة',
      loading: 'جارٍ تحميل المقالات...',
      articleCount: (n) => n === 1 ? 'مقال واحد' : '' + n + ' مقالات'
    };
    
    // Dynamic content loader
    document.addEventListener('DOMContentLoaded', () => {
      const articlesGrid = document.querySelector('.articles-grid');
      if (!articlesGrid) return;
      
      const articleCards = articlesGrid.querySelectorAll('.article-card');
      const articleCount = articleCards.length;
      
      // Update article count if element exists
      const countElement = document.querySelector('.article-count');
      if (countElement) {
        countElement.textContent = i18n.articleCount(articleCount);
      }
      
      // Show no articles message if empty
      if (articleCount === 0) {
        articlesGrid.innerHTML = `<p class="no-articles">${i18n.noArticles}</p>`;
      }
    });
  </script>
