<body>

  <div class="container">

    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-type">文章类型</label>
        <select id="filter-type">
          <option value="all">全部类型</option>

      <div class="filter-group">
        <label for="filter-topic">主题</label>
        <select id="filter-topic">
          <option value="all">全部主题</option>
          <option value="eu">欧盟事务</option>
          <option value="government">政府</option>
          <option value="parliament">议会</option>

        <select id="filter-sort">
          <option value="date-desc">最新优先</option>
          <option value="date-asc">最早优先</option>
          <option value="title">标题排序</option>

    <div class="articles-grid" id="articles-grid">

      <p>未找到符合筛选条件的文章。</p>

  <script>
    // News articles metadata
    const articles = [
      {
        title: "下周：布鲁塞尔峰会考验瑞典欧盟战略",
        date: "2026-02-10",
        type: "prospective",
        slug: "2026-02-10-week-ahead-feb-10-17-en.html",
        excerpt: "克里斯特松首相出席非正式领导人峰会，而欧盟委员会跟进国防和经济问题，对瑞典欧洲政策至关重要的一周。",
        topics: ["eu", "defense", "parliament", "citizenship", "environment"],
        tags: ["欧盟峰会", "布鲁塞尔", "国防政策", "议会监督"]
      },
      {
        title: "首相在布鲁塞尔峰会前面对议会",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-pm-eu-summit-en.html",
        excerpt: "在罕见的公开欧盟委员会会议上，乌尔夫·克里斯特松首相在非正式领导人峰会前咨询国会，而政府面临经济犯罪和公民身份政策的日益压力。",
        topics: ["eu", "government", "parliament"],
        tags: ["欧盟", "首相", "经济犯罪", "公民身份"]
      },
      {
        title: "宣布生物多样性战略和公民身份改革",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-biodiversity-citizenship-en.html",
        excerpt: "政府宣布全面的生物多样性战略，并表明重大公民身份改革，联合政府在环境和移民的竞争优先事项中寻求平衡。",
        topics: ["environment", "government", "legislation"],
        tags: ["生物多样性", "公民身份", "环境", "移民"]
      },
      {
        title: "政府提案 2026年2月",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-government-propositions-en.html",
        excerpt: "涵盖金融监管、可再生能源和财产安全的政策攻势标志着春季休会前的密集立法推动。",
        topics: ["government", "legislation", "parliament"],
        tags: ["提案", "金融", "气候", "财产", "税收"]
      },
      {
        title: "委员会报告 2026年2月",
        date: "2026-02-06",
        type: "analysis",
        slug: "2026-02-committee-reports-en.html",
        excerpt: "议会委员会提交涵盖教育、国防和社会政策的综合报告，国会进入关键决策阶段。",
        topics: ["committees", "parliament"],
        tags: ["委员会报告", "教育", "国防", "社会政策"]
      },
      {
        title: "反对党动议 2026年2月",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-opposition-motions-en.html",
        excerpt: "反对党通过针对经济犯罪、医疗保健和气候的政府政策的综合动议包，加强立法压力。",
        topics: ["parliament", "legislation"],
        tags: ["反对党", "动议", "经济犯罪", "医疗保健"]
      },
      {
        title: "议会议程 - 周概览",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-parliament-agenda-en.html",
        excerpt: "即将举行的议会活动全面预览，包括委员会会议、全体辩论和部长质询。",
        topics: ["parliament"],
        tags: ["议会", "议程", "周预览"]
      },
      {
        title: "下周展望",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-week-ahead-en.html",
        excerpt: "展望下周主要政治发展、议会活动和政府决定。",
        topics: ["parliament", "government"],
        tags: ["下周", "预览", "政治日历"]
      }
    ];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${article.type}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      return `${year}年${month}月${day}日`;
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hans'));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>
