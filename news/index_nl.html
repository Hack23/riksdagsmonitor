  <style>
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1e3d 100%);
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      padding: 0;
      margin: 0;
    }
    
    .header-section {
      background: rgba(26, 30, 61, 0.9);
      border-bottom: 2px solid var(--primary-cyan, #00d9ff);
      padding: 2rem 1rem;
      margin-bottom: 2rem;
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 1rem 0;
      background: linear-gradient(135deg, var(--primary-cyan, #00d9ff), var(--primary-magenta, #ff006e));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 1.1rem;
      color: #b0b0b0;
      margin: 0;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 3rem 1rem;
    }
    
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: rgba(26, 30, 61, 0.6);
      border-radius: 8px;
      border: 1px solid rgba(0, 217, 255, 0.3);
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .filter-group label {
      font-size: 0.9rem;
      color: var(--primary-cyan, #00d9ff);
      font-weight: 600;
    }
    
    .filter-group select {
      padding: 0.5rem;
      background: rgba(10, 14, 39, 0.8);
      border: 1px solid rgba(0, 217, 255, 0.5);
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    
    .filter-group select:hover {
      border-color: var(--primary-cyan, #00d9ff);
    }
    
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .article-card {
      background: rgba(26, 30, 61, 0.8);
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 8px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    
    .article-card:hover {
      border-color: var(--primary-cyan, #00d9ff);
      box-shadow: 0 4px 20px rgba(0, 217, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .article-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #888;
    }
    
    .article-date {
      color: var(--primary-cyan, #00d9ff);
    }
    
    .article-type {
      padding: 0.2rem 0.6rem;
      background: rgba(0, 217, 255, 0.1);
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .article-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: #fff;
      line-height: 1.4;
    }
    
    .article-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .article-title a:hover {
      color: var(--primary-cyan, #00d9ff);
    }
    
    .article-excerpt {
      color: #b0b0b0;
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    
    .article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
    }
    
    .tag {
      padding: 0.3rem 0.6rem;
      background: rgba(255, 0, 110, 0.1);
      border: 1px solid rgba(255, 0, 110, 0.3);
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--primary-magenta, #ff006e);
    }
    
    .no-results {
      text-align: center;
      padding: 3rem;
      color: #888;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      padding: 0.5rem 1rem;
      background: rgba(26, 30, 61, 0.8);
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 4px;
      color: var(--primary-cyan, #00d9ff);
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .back-link:hover {
      border-color: var(--primary-cyan, #00d9ff);
      background: rgba(0, 217, 255, 0.1);
    }
    
    @media (max-width: 768px) {
      .filter-bar {
        flex-direction: column;
      }
      
      .articles-grid {
        grid-template-columns: 1fr;
      }
    }

<body>
  <div class="header-section">
    <div class="header-content">
      <h1><span aria-hidden="true">📰</span> Riksdagsmonitor Nieuws</h1>
      <p class="subtitle">The Economist-stijl politieke journalistiek • Systematische transparantie • Democratische verantwoording</p>
    </div>
  </div>
  
  <div class="container">
    <a href="../index_nl.html" class="back-link">← Terug naar Dashboard</a>
    
    <div class="filter-bar">
      <div class="filter-group">
        <label for="filter-type">Artikeltype</label>
        <select id="filter-type">
          <option value="all">Alle Typen</option>
          <option value="retrospective">Retrospectief</option>
          <option value="prospective">Prospectief (Volgende Week)</option>
          <option value="analysis">Analyse</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-topic">Onderwerp</label>
        <select id="filter-topic">
          <option value="all">Alle Onderwerpen</option>
          <option value="eu">EU-zaken</option>
          <option value="government">Regering</option>
          <option value="parliament">Parlement</option>
          <option value="committees">Commissies</option>
          <option value="legislation">Wetgeving</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="filter-sort">Sorteren op</label>
        <select id="filter-sort">
          <option value="date-desc">Nieuwste Eerst</option>
          <option value="date-asc">Oudste Eerst</option>
          <option value="title">Titel A-Z</option>
        </select>
      </div>
    </div>
    
    <div class="articles-grid" id="articles-grid">
      <!-- Articles dynamically loaded via JavaScript -->
    </div>
    
    <div class="no-results" id="no-results" style="display: none;">
      <p>Geen artikelen gevonden die overeenkomen met uw filters.</p>
    </div>
  </div>
  
  <script>
    // News articles metadata
    const articles = [
      {
        title: "Volgende Week: Brusselse Top Test Zweedse EU-Strategie",
        date: "2026-02-10",
        type: "prospective",
        slug: "2026-02-10-week-ahead-feb-10-17-en.html",
        excerpt: "Kritieke week voor Zweeds Europees beleid terwijl premier Kristersson informele leiders top bijwoont terwijl EU-commissie defensie- en economische kwesties opvolgt.",
        topics: ["eu", "defense", "parliament", "citizenship", "environment"],
        tags: ["EU-top", "Brussel", "Defensiebeleid", "Parlementair Toezicht"]
      },
      {
        title: "Premier Staat Parlement te Woord Voor Brusselse Top",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-pm-eu-summit-en.html",
        excerpt: "In zeldzame openbare EU-commissievergadering raadpleegt premier Ulf Kristersson de Riksdag voor informele leiders top terwijl regering toenemende druk confronteert over economische criminaliteit en staatsburgerbeleid.",
        topics: ["eu", "government", "parliament"],
        tags: ["EU", "Premier", "Economische Criminaliteit", "Staatsburgerschap"]
      },
      {
        title: "Biodiversiteitsstrategie en Staatsburgerhervorming Aangekondigd",
        date: "2026-02-10",
        type: "retrospective",
        slug: "2026-02-10-biodiversity-citizenship-en.html",
        excerpt: "Regering kondigt uitgebreide biodiversiteitsstrategie aan en signaleert grote staatsbugerhervorming terwijl coalitie concurrerende prioriteiten navigeert op milieu en immigratie.",
        topics: ["environment", "government", "legislation"],
        tags: ["Biodiversiteit", "Staatsburgerschap", "Milieu", "Immigratie"]
      },
      {
        title: "Regeringsvoorstellen Februari 2026",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-government-propositions-en.html",
        excerpt: "Beleidsoffensief op financieel toezicht, hernieuwbare energie en eigendomsbeveiliging markeert intensieve wetgevingsimpuls voor voorjaarsreces.",
        topics: ["government", "legislation", "parliament"],
        tags: ["Voorstellen", "Financiën", "Klimaat", "Eigendom", "Belasting"]
      },
      {
        title: "Commissierapporten Februari 2026",
        date: "2026-02-06",
        type: "analysis",
        slug: "2026-02-committee-reports-en.html",
        excerpt: "Parlementaire commissies leveren uitgebreide rapporten over onderwijs, defensie en sociaal beleid terwijl Riksdag kritieke beslissingsfase ingaat.",
        topics: ["committees", "parliament"],
        tags: ["Commissierapporten", "Onderwijs", "Defensie", "Sociaal Beleid"]
      },
      {
        title: "Oppositiemoties Februari 2026",
        date: "2026-02-07",
        type: "analysis",
        slug: "2026-02-opposition-motions-en.html",
        excerpt: "Oppositiepartijen intensiveren wetgevingsdruk met uitgebreide motiepakketten gericht op regeringsbeleid over economische criminaliteit, gezondheidszorg en klimaat.",
        topics: ["parliament", "legislation"],
        tags: ["Oppositie", "Moties", "Economische Criminaliteit", "Gezondheidszorg"]
      },
      {
        title: "Parlementsagenda - Weekoverzicht",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-parliament-agenda-en.html",
        excerpt: "Uitgebreid vooruitzicht op komende parlementaire activiteit inclusief commissievergaderingen, kamerdebatten en ministeriële vragen.",
        topics: ["parliament"],
        tags: ["Parlement", "Agenda", "Weekvooruitzicht"]
      },
      {
        title: "De Volgende Week",
        date: "2026-02-09",
        type: "prospective",
        slug: "2026-02-week-ahead-en.html",
        excerpt: "Vooruitkijkend naar belangrijke politieke ontwikkelingen, parlementaire activiteit en regeringsbesluiten in de komende week.",
        topics: ["parliament", "government"],
        tags: ["Volgende Week", "Vooruitzicht", "Politieke Kalender"]
      }
    ];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${article.type}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const months = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();
      return `${day} ${month} ${year}`;
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>
</body>
