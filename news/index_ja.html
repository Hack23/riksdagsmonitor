    <!-- Articles Grid -->

  <script>
    // Dynamic articles array - generated from news/ directory
    const articles = [

    "date": "2026-02-10T09:00:00Z",
    "type": "analysis",

    "topics": [

    ],
    "tags": [

    ]
  },
  {
    "title": "Week Ahead: Brussels Summit Tests Swedish EU Strategy",
    "date": "2026-02-10T09:00:00Z",
    "type": "prospective",
    "slug": "2026-02-10-week-ahead-feb-10-17-en.html",
    "excerpt": "Critical week as PM faces Brussels summit while parliament intensifies oversight on citizenship, crime, and environment.",
    "topics": [
      "eu",
      "parliament"
    ],
    "tags": [
      "EU Summit",
      "Parliament",
      "Prospective Coverage"
    ]
  },
  {
    "title": "Government Propositions February 2026 | Riksdagsmonitor",
    "date": "2026-02-07T07:00:00+00:00",
    "type": "analysis",
    "slug": "2026-02-government-propositions-en.html",
    "excerpt": "Six propositions reveal coalition priorities: financial stability, green transition, and security crackdowns.",
    "topics": [
      "parliament"
    ],
    "tags": [
      "Riksdag"
    ]
  },
  {
    "title": "Fresh Opposition Motions - Spring 2026 Battle Lines Emerge",
    "date": "2026-02-07T00:00:00Z",
    "type": "analysis",
    "slug": "2026-02-opposition-motions-en.html",
    "excerpt": "Ten fresh opposition motions reveal spring parliamentary battle lines - from indefinite detention to elderly care and constitutional rights.",
    "topics": [
      "parliament"
    ],
    "tags": [
      "Riksdag",
      "Opposition",
      "Motions"
    ]
  },
  {
    "title": "Critical Week for Sweden in EU: Defense Council and Prime Minister",
    "date": "2026-02-07T00:00:00+01:00",
    "type": "prospective",
    "slug": "2026-02-week-ahead-en.html",
    "excerpt": "Critical week for Swedish EU policy: Defense Minister and Prime Minister face councils in Brussels while opposition intensifies government scrutiny.",
    "topics": [
      "eu",
      "defense"
    ],
    "tags": [
      "EU",
      "Defense",
      "Accountability",
      "Ukraine"
    ]
  }
];
    
    let filteredArticles = [...articles];
    
    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articles-grid');
      const noResults = document.getElementById('no-results');
      
      if (articlesToRender.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      grid.innerHTML = articlesToRender.map(article => `
        <article class="article-card">
          <div class="article-meta">
            <time class="article-date" datetime="${article.date}">${formatDate(article.date)}</time>
            <span class="article-type">${article.type}</span>
          </div>
          <h2 class="article-title">
            <a href="${article.slug}">${article.title}</a>
          </h2>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-tags">
            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('ja', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    
    function filterArticles() {
      const typeFilter = document.getElementById('filter-type').value;
      const topicFilter = document.getElementById('filter-topic').value;
      const sortFilter = document.getElementById('filter-sort').value;
      
      let filtered = [...articles];
      
      // Apply type filter
      if (typeFilter !== 'all') {
        filtered = filtered.filter(article => article.type === typeFilter);
      }
      
      // Apply topic filter
      if (topicFilter !== 'all') {
        filtered = filtered.filter(article => article.topics.includes(topicFilter));
      }
      
      // Apply sorting
      switch(sortFilter) {
        case 'date-desc':
          filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case 'date-asc':
          filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case 'title':
          filtered.sort((a, b) => a.title.localeCompare(b.title));
          break;
      }
      
      filteredArticles = filtered;
      renderArticles(filteredArticles);
    }
    
    // Event listeners
    document.getElementById('filter-type').addEventListener('change', filterArticles);
    document.getElementById('filter-topic').addEventListener('change', filterArticles);
    document.getElementById('filter-sort').addEventListener('change', filterArticles);
    
    // Initial render
    filterArticles();
  </script>
