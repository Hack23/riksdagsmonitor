<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Load Test - Riksdagsmonitor</title>
    <style>
        body { 
            font-family: 'Inter', Arial, sans-serif; 
            padding: 20px; 
            background: #0a0e27;
            color: #e0e0e0;
        }
        h1 { color: #00d9ff; }
        .test-result { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
            font-size: 16px;
        }
        .success { 
            background: rgba(76, 175, 80, 0.2); 
            border: 2px solid #4caf50; 
            color: #4caf50; 
        }
        .error { 
            background: rgba(244, 67, 54, 0.2); 
            border: 2px solid #f44336; 
            color: #f44336; 
        }
        #chartContainer { 
            background: #1a1e3d; 
            padding: 20px; 
            margin-top: 20px; 
            border-radius: 10px;
            border: 1px solid #00d9ff;
        }
        h2 { color: #ffbe0b; }
    </style>
</head>
<body>
    <h1>🔬 JavaScript Library Load Test</h1>
    <p>Testing locally-hosted libraries from CloudFront/S3 (js/lib/)</p>
    
    <div id="results"></div>
    
    <div id="chartContainer">
        <h2>📊 Chart.js Visualization Test</h2>
        <canvas id="testChart" width="400" height="200"></canvas>
    </div>

    <!-- Load libraries from local CloudFront/S3 -->
    <script src="js/lib/d3.min.js"></script>
    <script src="js/lib/chart.umd.js"></script>
    <script src="js/lib/chartjs-plugin-annotation.min.js"></script>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(library, loaded, version) {
            const div = document.createElement('div');
            div.className = `test-result ${loaded ? 'success' : 'error'}`;
            const versionText = version ? ` (v${version})` : '';
            div.innerHTML = `<strong>${library}${versionText}:</strong> ${loaded ? '✅ Loaded successfully' : '❌ Failed to load'}`;
            results.appendChild(div);
        }
        
        // Test D3.js
        const d3Loaded = typeof d3 !== 'undefined';
        addResult('D3.js', d3Loaded, d3Loaded ? d3.version : null);
        
        // Test Chart.js
        const chartLoaded = typeof Chart !== 'undefined';
        addResult('Chart.js', chartLoaded, chartLoaded ? Chart.version : null);
        
        // Test chartjs-plugin-annotation
        const annotationLoaded = chartLoaded && Chart.registry.plugins.get('annotation');
        addResult('chartjs-plugin-annotation', annotationLoaded);
        
        // Add overall status
        const allLoaded = d3Loaded && chartLoaded && annotationLoaded;
        const statusDiv = document.createElement('div');
        statusDiv.className = `test-result ${allLoaded ? 'success' : 'error'}`;
        statusDiv.innerHTML = `<strong>Overall Status:</strong> ${allLoaded ? '✅ All libraries loaded successfully - Dashboards will work!' : '❌ Some libraries failed to load'}`;
        results.appendChild(statusDiv);
        
        // Create a simple test chart if Chart.js loaded
        if (chartLoaded) {
            const ctx = document.getElementById('testChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Socialdemokraterna', 'Moderaterna', 'Sverigedemokraterna', 'Centerpartiet', 'Vänsterpartiet'],
                    datasets: [{
                        label: 'Test Data (Riksdag Seats)',
                        data: [107, 68, 73, 24, 24],
                        backgroundColor: ['#e8112d', '#52bdec', '#dddd00', '#009933', '#af0000']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '✅ Chart.js is working correctly!',
                            color: '#ffbe0b',
                            font: { size: 16 }
                        },
                        legend: {
                            labels: { color: '#e0e0e0' }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#e0e0e0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
