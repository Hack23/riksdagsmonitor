              - "index_nl.html"
              - "index_ar.html"
              - "index_he.html"
              - "index_ja.html"
              - "index_ko.html"
              - "index_zh.html"
              - "news/**/*-sv.html"
              - "news/**/*-da.html"
              - "news/**/*-no.html"
              - "news/**/*-fi.html"
              - "news/**/*-de.html"
              - "news/**/*-fr.html"
              - "news/**/*-es.html"
              - "news/**/*-nl.html"
              - "news/**/*-ar.html"
              - "news/**/*-he.html"
