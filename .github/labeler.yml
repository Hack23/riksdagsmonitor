          - any-glob-to-any-file:
              - ".github/workflows/data-pipeline.yml"
              - "scripts/fetch-*.js"
              - "scripts/validate-*.js"
      - title: "pipeline:*"
      - title: "etl:*"
      - body: "- [x] 🔄 Data Pipeline"

schema:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "schemas/**"
              - "**/*.schema.json"
              - ".github/workflows/check-cia-schema-updates.yml"
              - ".github/workflows/sync-cia-schemas.yml"
      - title: "schema:*"
      - body: "- [x] 📋 Schema"

