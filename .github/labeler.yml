# Automatic Pull Request Labeling Configuration for Riksdagsmonitor
# Based on file changes, PR title, and PR body content
# Aligned with static HTML/CSS political transparency platform architecture

# ============================================================================
# 🗳️ CONTENT & FEATURES
# ============================================================================

news:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "news/**/*.html"
              - "news/**/*.md"
              - "scripts/article-template.js"
              - "scripts/generate-*.js"
              - ".github/workflows/news-*.yml"
              - ".github/workflows/news-*.md"
      - title: "news:*"
      - title: "content:*"
      - body: "- [x] 📰 News Content"

dashboard:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "dashboard/**"
              - "js/*-dashboard.js"
              - "*-dashboard.html"
              - "politician-dashboard.html"
      - title: "dashboard:*"
      - body: "- [x] 📊 Dashboard"

visualization:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "js/*-dashboard.js"
              - "js/lib/chart*.js"
              - "js/lib/d3*.js"
              - "cia-data/**/*.csv"
      - title: "viz:*"
      - title: "chart:*"
      - title: "visualization:*"
      - body: "- [x] 📈 Data Visualization"

intelligence:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "cia-data/**"
              - "data/cia/**"
              - "schemas/cia/**"
              - "scripts/load-cia-*.js"
      - title: "intelligence:*"
      - title: "cia:*"
      - body: "- [x] 🔍 Political Intelligence"

# ============================================================================
# 💻 TECHNOLOGY
# ============================================================================

html-css:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "**/*.html"
              - "**/*.css"
              - "styles.css"
      - title: "html:*"
      - title: "css:*"
      - title: "style:*"
      - body: "- [x] 🎨 HTML/CSS"

javascript:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "**/*.js"
              - "**/*.mjs"
              - "js/**"
              - "scripts/**/*.js"
      - title: "js:*"
      - title: "javascript:*"
      - body: "- [x] 💻 JavaScript"

workflow:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - ".github/workflows/**/*.yml"
              - ".github/workflows/**/*.md"
              - ".github/copilot-*.yml"
              - ".github/copilot-*.json"
      - title: "workflow:*"
      - title: "github-actions:*"
      - body: "- [x] ⚙️ GitHub Actions"

security:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "SECURITY_ARCHITECTURE.md"
              - "THREAT_MODEL.md"
              - "FUTURE_SECURITY_ARCHITECTURE.md"
              - ".github/workflows/codeql.yml"
              - ".github/workflows/scorecards.yml"
      - title: "security:*"
      - title: "sec:*"
      - body: "- [x] 🔒 Security"

# ============================================================================
# 📊 DATA INTEGRATION
# ============================================================================

cia-data:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "cia-data/**"
              - "data/cia/**"
              - "data/cia-exports/**"
              - "schemas/cia/**"
              - "scripts/load-cia-*.js"
              - "scripts/update-stats-from-cia.js"
              - ".github/workflows/update-cia-stats.yml"
              - ".github/workflows/validate-cia-data.yml"
      - title: "cia:*"
      - title: "cia-data:*"
      - body: "- [x] 🗂️ CIA Data"

riksdag-data:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "scripts/mcp-client.js"
              - "scripts/fetch-riksdag-*.js"
              - ".github/copilot-mcp.json"
      - title: "riksdag:*"
      - title: "mcp:*"
      - body: "- [x] 🏛️ Riksdag Data"

data-pipeline:
