name: 'News workflow pre-warm & pre-flight'
description: |
  Shared setup for every `.github/workflows/news-*.md` agentic workflow:
    1. Set up Node.js 25 (matches `runtimes.node.version` in every workflow).
    2. `npm ci --prefer-offline --no-audit`.
    3. Pre-warm the riksdag-regering MCP server (Render.com cold-start mitigation).
    4. Pre-flight DNS + HTTPS reachability + MCP `tools/list` probe for the
       upstream services consumed by the news pipeline.
    5. IMF connectivity & vintage pre-flight gate
        (`scripts/check-imf-connectivity.ts`) writing `data/imf-context.json`
       on success/degradation or `data/imf-unavailable.flag` on critical
       WEO/FM failure, so the agentic analysis pipeline can annotate per
       `analysis/imf/agentic-integration.md` §"Pre-warm gate" and
       `.github/aw/ECONOMIC_DATA_CONTRACT.md` v2.1.

  This action exists to deduplicate ~80 lines of identical YAML across the 11
  news workflow files. Edit it in one place.
inputs:
  node-version:
    description: 'Node.js version (must match the workflow `runtimes.node.version`).'
    required: false
    default: '25'
  mcp-url:
    description: 'Riksdag-regering MCP HTTP endpoint to pre-warm.'
    required: false
    default: 'https://riksdag-regering-ai.onrender.com/mcp'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit

    - name: Pre-warm MCP server (Render.com cold start mitigation)
      shell: bash
      env:
        MCP_URL: ${{ inputs.mcp-url }}
      run: |
        echo "🔥 Pre-warming riksdag-regering MCP server via MCP protocol..."
        WARM=false
        for i in 1 2 3 4 5 6; do
          RESP=$(curl -sf --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "$MCP_URL" 2>/dev/null) || true
          if echo "$RESP" | grep -q '"tools"'; then
            TOOL_COUNT=$(echo "$RESP" | grep -o '"name"' | wc -l)
            echo "✅ MCP server responded on attempt $i with $TOOL_COUNT tools registered"
            WARM=true
            break
          fi
          echo "⏳ Attempt $i/6 — server may be cold-starting, waiting 20s..."
          sleep 20
        done
        if [ "$WARM" = "false" ]; then
          echo "⚠️ MCP server did not respond after 6 attempts — agent will retry via in-prompt health gate"
        fi

    - name: Pre-flight external endpoint reachability check (runs before MCP Gateway)
      shell: bash
      env:
        MCP_URL: ${{ inputs.mcp-url }}
      run: |
        echo "🔍 Network Diagnostics — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        echo "═══════════════════════════════════════════"
        echo ""
        echo "📡 DNS Resolution Tests:"
        for domain in riksdag-regering-ai.onrender.com api.scb.se api.worldbank.org www.imf.org api.imf.org data.imf.org sdmxcentral.imf.org data.riksdagen.se www.riksdagen.se www.regeringen.se www.statskontoret.se statskontoret.se www.lagradet.se lagradet.se; do
          if nslookup "$domain" >/dev/null 2>&1; then
            IP=$(nslookup "$domain" 2>/dev/null | grep -A1 "Name:" | grep "Address:" | head -1 | awk '{print $2}')
            echo "  ✅ $domain → $IP"
          else
            echo "  ❌ $domain — DNS FAILED"
          fi
        done
        echo ""
        echo "🌐 HTTPS Connectivity Tests:"
        for url in \
          "$MCP_URL" \
          "https://api.scb.se/OV0104/v2beta" \
          "https://api.worldbank.org/v2/country/SE?format=json" \
          "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/SWE" \
          "https://data.riksdagen.se/dokumentlista/?sok=test&doktyp=bet&utformat=json&a=1" \
        ; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "000")
          DOMAIN=$(echo "$url" | sed 's|https://||' | cut -d/ -f1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "  ✅ $DOMAIN → HTTP $HTTP_CODE"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "  ❌ $DOMAIN → TIMEOUT/UNREACHABLE"
          else
            echo "  ⚠️ $DOMAIN → HTTP $HTTP_CODE"
          fi
        done
        echo ""
        echo "🔌 MCP Server Tool Count:"
        TOOL_RESP=$(curl -sf --max-time 15 -X POST \
          -H "Content-Type: application/json" \
          -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
          "$MCP_URL" 2>/dev/null) || TOOL_RESP=""
        if echo "$TOOL_RESP" | grep -q '"tools"'; then
          TOOL_COUNT=$(echo "$TOOL_RESP" | grep -o '"name"' | wc -l)
          echo "  ✅ riksdag-regering MCP: $TOOL_COUNT tools registered"
        else
          echo "  ❌ riksdag-regering MCP: No tools response (server may still be starting)"
        fi
        echo ""
        echo "═══════════════════════════════════════════"

    - name: IMF connectivity pre-flight & vintage gate
      shell: bash
      # Probes the three IMF transports (WEO + FM via Datamapper, IFS via
      # SDMX 3.0) and writes data/imf-context.json with the result. On
      # critical WEO/FM connectivity failure also writes
      # data/imf-unavailable.flag, which downstream analysis steps read to
      # inject the standard "⚠️ IMF context unavailable" block into executive-brief.md,
      # comparative-international.md, and synthesis-summary.md per
      # analysis/imf/agentic-integration.md §6.1.
      #
      # Non-blocking by design: the script exits 0 even when probes fail
      # so the pre-warm does not abort the entire workflow — the agent
      # is expected to degrade gracefully via the flag file. Use --strict
      # only for ad-hoc operator debugging.
      #
      # 60-second hard timeout per the issue's acceptance criteria.
      run: |
        echo ""
        echo "🌍 IMF connectivity pre-flight — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        echo "═══════════════════════════════════════════"
        timeout 60 npx tsx scripts/check-imf-connectivity.ts --output-dir data \
          > /tmp/imf-precheck.json 2> /tmp/imf-precheck.err || true
        if [ -f data/imf-unavailable.flag ]; then
          echo "  ⚠️ IMF connectivity FAILED — flag file written (workflow continues, agent must inject ⚠️ block)"
          cat /tmp/imf-precheck.err 2>/dev/null || true
        elif [ -f data/imf-context.json ]; then
          STATUS=$(grep -o '"status": "[^"]*"' data/imf-context.json | head -1 | cut -d'"' -f4)
          AGE=$(grep -o '"vintageAgeMonths": [0-9-]*' data/imf-context.json | head -1 | awk '{print $2}')
          if [ "$STATUS" = "degraded" ]; then
            echo "  ℹ️ IMF connectivity DEGRADED (status=$STATUS, vintageAgeMonths=$AGE) — critical WEO/FM context is available"
          else
            echo "  ✅ IMF connectivity OK (status=$STATUS, vintageAgeMonths=$AGE)"
          fi
        else
          # Script was killed by `timeout 60` or crashed before it could
          # write either artifact. Synthesise a minimal `unavailable`
          # report so downstream analysis steps still have a deterministic
          # on-disk signal to inject the standard ⚠️ block.
          echo "  ❌ IMF pre-flight produced no output (timeout or crash) — writing fallback unavailable artifacts"
          cat /tmp/imf-precheck.err 2>/dev/null || true
          mkdir -p data
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          cat > data/imf-context.json <<EOF
        {
          "status": "unavailable",
          "vintage": "unknown",
          "vintageAgeMonths": -1,
          "stale": true,
          "probes": [],
          "checkedAt": "$NOW",
          "warningBlock": "> ⚠️ **IMF context unavailable**\n>\n> The IMF pre-flight check at $NOW timed out or crashed before completing. Economic claims in this article are grounded in the most recent cached IMF release where available; figures labelled \"inferred\" use SCB ground-truth or Riksbank minutes as the fallback source per \`analysis/imf/agentic-integration.md\` §6.1.\n>\n> Failed probes: pre-flight script timeout-or-crash-before-artifact-write.\n>\n> This annotation is required by \`.github/aw/ECONOMIC_DATA_CONTRACT.md\` v2.1 §\"Vintage discipline\" and the AI-FIRST quality principle in \`AGENTS.md\`.",
          "reason": "timeout-or-crash-before-artifact-write"
        }
        EOF
          cat > data/imf-unavailable.flag <<EOF
        # IMF connectivity pre-flight failed
        # checkedAt: $NOW
        # failed-probes: timeout-or-crash-before-artifact-write
        #
        # The pre-flight script (scripts/check-imf-connectivity.ts) was
        # killed by the 60-second composite-action timeout or crashed
        # before it could write its own report. Workflows reading this
        # flag MUST inject the standard "⚠️ IMF context unavailable"
        # block into executive-brief.md, comparative-international.md,
        # and synthesis-summary.md per analysis/imf/agentic-integration.md §6.1.
        {"status":"unavailable","reason":"timeout-or-crash-before-artifact-write","checkedAt":"$NOW"}
        EOF
        fi
        echo "═══════════════════════════════════════════"
