name: 'News workflow pre-warm & pre-flight'
description: |
  Shared setup for every `.github/workflows/news-*.md` agentic workflow:
    1. Set up Node.js 26 (matches `runtimes.node.version` in every workflow).
    2. `npm ci --prefer-offline --no-audit`.
    3. Pre-warm the riksdag-regering MCP server (Render.com cold-start mitigation).
    4. Pre-flight DNS + HTTPS reachability + MCP `tools/list` probe for the
       upstream services consumed by the news pipeline.
    5. IMF connectivity & vintage pre-flight gate
        (`scripts/check-imf-connectivity.ts`) writing `data/imf-context.json`
       on success/degradation or `data/imf-unavailable.flag` on critical
       WEO/FM failure, so the agentic analysis pipeline can annotate per
       `analysis/imf/agentic-integration.md` §"Pre-warm gate" and
       `.github/aw/ECONOMIC_DATA_CONTRACT.md` v3.0.

  This action exists to deduplicate ~80 lines of identical YAML across the 14
  news workflow files. Edit it in one place.
inputs:
  node-version:
    description: 'Node.js version (must match the workflow `runtimes.node.version`).'
    required: false
    default: '26'
  mcp-url:
    description: 'Riksdag-regering MCP HTTP endpoint to pre-warm.'
    required: false
    default: 'https://riksdag-regering-ai.onrender.com/mcp'
  imf-sdmx-subscription-key:
    description: |
      IMF Data SDMX API subscription key (Azure APIM `Ocp-Apim-Subscription-Key`).
      Sent on every SDMX 3.0/2.1 `/data/...` request by `scripts/imf-client.ts`
      and the `tsx scripts/imf-fetch.ts sdmx ...` CLI. The Datamapper
      transport (WEO + FM) is unauthenticated and never receives this header.
      When set, the value is exported to `$GITHUB_ENV` as
      `IMF_SDMX_SUBSCRIPTION_KEY` so it propagates to the IMF pre-flight
      step in this composite action AND to the agent's `bash:` tool inside
      the `Execute GitHub Copilot CLI` step (which runs `awf --env-all`).
      Default is the empty string — workflows MUST forward
      `secrets.IMF_SDMX_SUBSCRIPTION_KEY` from the calling workflow
      via `with:` for SDMX calls (IFS / BOP / DOTS / GFS_COFOG / MFS_IR /
      PCPS / ER) to function. Without the key the connectivity report
      reports `status: degraded` with reason
      `sdmx-subscription-key-not-configured`.
    required: false
    default: ''
  calendar-org:
    description: 'Optional calendar org/committee code for forward-indicator status output (default: SfU).'
    required: false
    default: 'SfU'
  calendar-lookahead-days:
    description: 'Number of days ahead to include in calendar-status.json.'
    required: false
    default: '30'
  lagradet-reference:
    description: 'Optional proposition or motion reference for Lagrådet yttrande lookup.'
    required: false
    default: ''
  rss-watch-dok-ids:
    description: 'Optional comma-separated dok_ids to match in the Riksdagen RSS watcher.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit

    - name: Export IMF SDMX subscription key to job environment
      shell: bash
      # Mask the key in any captured logs (defence-in-depth — gh-aw also
      # wraps every `secrets.*` reference) and propagate it to
      # subsequent steps via $GITHUB_ENV so:
      #   1. The IMF pre-flight step below sees IMF_SDMX_SUBSCRIPTION_KEY
      #      and `scripts/imf-client.ts` adds the Ocp-Apim-Subscription-Key
      #      header to its SDMX request.
      #   2. The downstream `Execute GitHub Copilot CLI` step runs
      #      `awf --env-all`, which forwards every runner env var into the
      #      firewall container, so the agent's `bash:` tool can call
      #      `tsx scripts/imf-fetch.ts sdmx ...` against the authenticated
      #      SDMX 3.0 surfaces (IFS / BOP / DOTS / GFS_COFOG / MFS /
      #      PCPS / ER).
      # Skipped when no key is provided — the run continues in degraded
      # mode (WEO/FM still work via Datamapper) and the connectivity
      # report records `sdmx-subscription-key-not-configured`.
      env:
        IMF_KEY: ${{ inputs.imf-sdmx-subscription-key }}
      run: |
        if [ -n "${IMF_KEY}" ]; then
          echo "::add-mask::${IMF_KEY}"
          {
            echo "IMF_SDMX_SUBSCRIPTION_KEY<<GH_AW_IMF_KEY_EOF"
            printf '%s\n' "${IMF_KEY}"
            echo "GH_AW_IMF_KEY_EOF"
          } >> "$GITHUB_ENV"
          echo "  ✅ IMF_SDMX_SUBSCRIPTION_KEY exported to job environment"
        else
          echo "  ℹ️ no IMF SDMX subscription key supplied — SDMX 3.0 calls will report status=degraded"
        fi

    - name: Pre-warm MCP server (Render.com cold start mitigation)
      shell: bash
      env:
        MCP_URL: ${{ inputs.mcp-url }}
      run: |
        echo "🔥 Pre-warming riksdag-regering MCP server via MCP protocol..."
        WARM=false
        for i in 1 2 3 4 5 6; do
          RESP=$(curl -sf --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "$MCP_URL" 2>/dev/null) || true
          if echo "$RESP" | grep -q '"tools"'; then
            TOOL_COUNT=$(echo "$RESP" | grep -o '"name"' | wc -l)
            echo "✅ MCP server responded on attempt $i with $TOOL_COUNT tools registered"
            WARM=true
            break
          fi
          echo "⏳ Attempt $i/6 — server may be cold-starting, waiting 20s..."
          sleep 20
        done
        if [ "$WARM" = "false" ]; then
          echo "⚠️ MCP server did not respond after 6 attempts — agent will retry via in-prompt health gate"
        fi

    - name: Pre-flight external endpoint reachability check (runs before MCP Gateway)
      shell: bash
      env:
        MCP_URL: ${{ inputs.mcp-url }}
      run: |
        echo "🔍 Network Diagnostics — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        echo "═══════════════════════════════════════════"
        echo ""
        echo "📡 DNS Resolution Tests:"
        for domain in riksdag-regering-ai.onrender.com api.scb.se api.worldbank.org www.imf.org api.imf.org data.imf.org data.riksdagen.se www.riksdagen.se www.regeringen.se www.statskontoret.se statskontoret.se www.lagradet.se lagradet.se; do
          if nslookup "$domain" >/dev/null 2>&1; then
            IP=$(nslookup "$domain" 2>/dev/null | grep -A1 "Name:" | grep "Address:" | head -1 | awk '{print $2}')
            echo "  ✅ $domain → $IP"
          else
            echo "  ❌ $domain — DNS FAILED"
          fi
        done
        echo ""
        echo "🌐 HTTPS Connectivity Tests:"
        for url in \
          "$MCP_URL" \
          "https://api.scb.se/OV0104/v2beta" \
          "https://api.worldbank.org/v2/country/SE?format=json" \
          "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/SWE" \
          "https://www.lagradet.se/" \
          "https://data.riksdagen.se/dokumentlista/?sok=test&doktyp=bet&utformat=json&a=1" \
        ; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "000")
          DOMAIN=$(echo "$url" | sed 's|https://||' | cut -d/ -f1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "  ✅ $DOMAIN → HTTP $HTTP_CODE"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "  ❌ $DOMAIN → TIMEOUT/UNREACHABLE"
          else
            echo "  ⚠️ $DOMAIN → HTTP $HTTP_CODE"
          fi
        done
        echo ""
        echo "🔌 MCP Server Tool Count:"
        TOOL_RESP=$(curl -sf --max-time 15 -X POST \
          -H "Content-Type: application/json" \
          -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
          "$MCP_URL" 2>/dev/null) || TOOL_RESP=""
        if echo "$TOOL_RESP" | grep -q '"tools"'; then
          TOOL_COUNT=$(echo "$TOOL_RESP" | grep -o '"name"' | wc -l)
          echo "  ✅ riksdag-regering MCP: $TOOL_COUNT tools registered"
        else
          echo "  ❌ riksdag-regering MCP: No tools response (server may still be starting)"
        fi
        echo ""
        echo "═══════════════════════════════════════════"

    - name: IMF connectivity pre-flight & vintage gate
      shell: bash
      # Probes the three IMF transports (WEO + FM via Datamapper, IFS via
      # SDMX 3.0) and writes data/imf-context.json with the result. On
      # critical WEO/FM connectivity failure also writes
      # data/imf-unavailable.flag, which downstream analysis steps read to
      # inject the standard "⚠️ IMF context unavailable" block into executive-brief.md,
      # comparative-international.md, and synthesis-summary.md per
      # analysis/imf/agentic-integration.md §6.1.
      #
      # Non-blocking by design: the script exits 0 even when probes fail
      # so the pre-warm does not abort the entire workflow — the agent
      # is expected to degrade gracefully via the flag file. Use --strict
      # only for ad-hoc operator debugging.
      #
      # 60-second hard timeout per the issue's acceptance criteria.
      run: |
        echo ""
        echo "🌍 IMF connectivity pre-flight — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        echo "═══════════════════════════════════════════"
        timeout 60 npx tsx scripts/check-imf-connectivity.ts --output-dir data \
          > /tmp/imf-precheck.json 2> /tmp/imf-precheck.err || true
        if [ -f data/imf-unavailable.flag ]; then
          echo "  ⚠️ IMF connectivity FAILED — flag file written (workflow continues, agent must inject ⚠️ block)"
          cat /tmp/imf-precheck.err 2>/dev/null || true
        elif [ -f data/imf-context.json ]; then
          STATUS=$(grep -o '"status": "[^"]*"' data/imf-context.json | head -1 | cut -d'"' -f4)
          AGE=$(grep -o '"vintageAgeMonths": [0-9-]*' data/imf-context.json | head -1 | awk '{print $2}')
          if [ "$STATUS" = "degraded" ]; then
            echo "  ℹ️ IMF connectivity DEGRADED (status=$STATUS, vintageAgeMonths=$AGE) — critical WEO/FM context is available"
          else
            echo "  ✅ IMF connectivity OK (status=$STATUS, vintageAgeMonths=$AGE)"
          fi
        else
          # Script was killed by `timeout 60` or crashed before it could
          # write either artifact. Synthesise a minimal `unavailable`
          # report so downstream analysis steps still have a deterministic
          # on-disk signal to inject the standard ⚠️ block.
          echo "  ❌ IMF pre-flight produced no output (timeout or crash) — writing fallback unavailable artifacts"
          cat /tmp/imf-precheck.err 2>/dev/null || true
          mkdir -p data
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          cat > data/imf-context.json <<EOF
        {
          "status": "unavailable",
          "vintage": "unknown",
          "vintageAgeMonths": -1,
          "stale": true,
          "probes": [],
          "checkedAt": "$NOW",
          "warningBlock": "> ⚠️ **IMF context unavailable**\n>\n> The IMF pre-flight check at $NOW timed out or crashed before completing. Economic claims in this article are grounded in the most recent cached IMF release where available; figures labelled \"inferred\" use SCB ground-truth or Riksbank minutes as the fallback source per \`analysis/imf/agentic-integration.md\` §6.1.\n>\n> Failed probes: pre-flight script timeout-or-crash-before-artifact-write.\n>\n> This annotation is required by \`.github/aw/ECONOMIC_DATA_CONTRACT.md\` v3.0 §\"Vintage discipline\" and the AI-FIRST quality principle in \`AGENTS.md\`.",
          "reason": "timeout-or-crash-before-artifact-write"
        }
        EOF
          cat > data/imf-unavailable.flag <<EOF
        # IMF connectivity pre-flight failed
        # checkedAt: $NOW
        # failed-probes: timeout-or-crash-before-artifact-write
        #
        # The pre-flight script (scripts/check-imf-connectivity.ts) was
        # killed by the 60-second composite-action timeout or crashed
        # before it could write its own report. Workflows reading this
        # flag MUST inject the standard "⚠️ IMF context unavailable"
        # block into executive-brief.md, comparative-international.md,
        # and synthesis-summary.md per analysis/imf/agentic-integration.md §6.1.
        {"status":"unavailable","reason":"timeout-or-crash-before-artifact-write","checkedAt":"$NOW"}
        EOF
        fi
        echo "═══════════════════════════════════════════"

    - name: Polling context pre-flight
      shell: bash
      run: |
        echo ""
        echo "🗳️ Polling context pre-flight — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        if timeout 60 npx tsx scripts/polling-fetch.ts --output data/polling-context.json >/tmp/polling-context.json 2>/tmp/polling-context.err; then
          PROVIDERS=$(grep -c '"provider"' data/polling-context.json 2>/dev/null || echo 0)
          echo "  ✅ polling context updated (${PROVIDERS} provider entries)"
        else
          echo "  ⚠️ polling context fetch failed — continuing without blocking workflow"
          cat /tmp/polling-context.err 2>/dev/null || true
        fi

    - name: Calendar forward-indicator status
      shell: bash
      env:
        CALENDAR_ORG: ${{ inputs.calendar-org }}
        CALENDAR_LOOKAHEAD_DAYS: ${{ inputs.calendar-lookahead-days }}
      run: |
        echo ""
        echo "📅 Calendar forward indicators — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        FROM=$(date -u '+%Y-%m-%d')
        TO=$(date -u -d "$FROM +${CALENDAR_LOOKAHEAD_DAYS} days" '+%Y-%m-%d')
        if timeout 60 npx tsx scripts/calendar-fetch.ts --from "$FROM" --to "$TO" --org "$CALENDAR_ORG" --output data/calendar-status.json >/tmp/calendar-status.json 2>/tmp/calendar-status.err; then
          COUNT=$(grep -o '"eventCount": [0-9]*' data/calendar-status.json | head -1 | awk '{print $2}')
          echo "  ✅ calendar status updated for org=${CALENDAR_ORG} (events=${COUNT:-0})"
        else
          echo "  ⚠️ calendar status fetch failed — continuing without blocking workflow"
          cat /tmp/calendar-status.err 2>/dev/null || true
        fi

    - name: Lagrådet yttrande status
      shell: bash
      env:
        LAGRADET_REFERENCE: ${{ inputs.lagradet-reference }}
      run: |
        echo ""
        echo "⚖️ Lagrådet status pre-flight — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        if [ -n "${LAGRADET_REFERENCE}" ]; then
          timeout 60 npx tsx scripts/lagradet-fetch.ts --reference "${LAGRADET_REFERENCE}" --output data/lagradet-status.json >/tmp/lagradet-status.json 2>/tmp/lagradet-status.err || true
        else
          timeout 60 npx tsx scripts/lagradet-fetch.ts --output data/lagradet-status.json >/tmp/lagradet-status.json 2>/tmp/lagradet-status.err || true
        fi
        if [ -f data/lagradet-status.json ]; then
          STATUS=$(grep -o '"status": "[^"]*"' data/lagradet-status.json | head -1 | cut -d'"' -f4)
          echo "  ✅ lagrådet status artifact written (status=${STATUS:-unknown})"
        else
          echo "  ⚠️ lagrådet status fetch failed — continuing without blocking workflow"
          cat /tmp/lagradet-status.err 2>/dev/null || true
        fi

    - name: RSS watch pre-flight
      shell: bash
      env:
        RSS_WATCH_DOK_IDS: ${{ inputs.rss-watch-dok-ids }}
      run: |
        echo ""
        echo "📡 RSS watch pre-flight — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        if [ -n "${RSS_WATCH_DOK_IDS}" ]; then
          timeout 60 npx tsx scripts/rss-watch.ts --dok-ids "${RSS_WATCH_DOK_IDS}" --output data/rss-watch.json >/tmp/rss-watch.json 2>/tmp/rss-watch.err || true
        else
          timeout 60 npx tsx scripts/rss-watch.ts --output data/rss-watch.json >/tmp/rss-watch.json 2>/tmp/rss-watch.err || true
        fi
        if [ -f data/rss-watch.json ]; then
          SIGNALS=$(grep -o '"signalCount": [0-9]*' data/rss-watch.json | head -1 | awk '{print $2}')
          echo "  ✅ rss watch artifact written (signals=${SIGNALS:-0})"
        else
          echo "  ⚠️ rss watch failed — continuing without blocking workflow"
          cat /tmp/rss-watch.err 2>/dev/null || true
        fi
