name: Sync CIA Data

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if files exist'
        required: false
        default: 'true'
  push:
    paths:
      - 'scripts/sync-cia-schemas.ts'
      - '.github/workflows/sync-cia-schemas.yml'

permissions:
  contents: write

jobs:
  sync-schemas:
    name: Sync CIA Schemas
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed"

      - name: Sync CIA CSV data files
        id: sync
        run: |
          echo "🔄 Syncing CIA CSV data files from upstream..."
          npm run sync-schemas
          
          # Count synced files
          if [ -f schemas/metadata/last-sync.json ]; then
            SYNCED=$(jq -r '.syncedCount' schemas/metadata/last-sync.json 2>/dev/null || echo "0")
            FAILED=$(jq -r '.failedCount' schemas/metadata/last-sync.json 2>/dev/null || echo "0")
            
            echo "synced=$SYNCED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            
            echo "✅ Synced $SYNCED CSV file(s)"
            if [ "$FAILED" -gt 0 ]; then
              echo "⚠️ Failed to sync $FAILED CSV file(s)"
            fi
          fi

      - name: Generate sync summary
        if: always()
        run: |
          echo "## 🔄 CIA CSV Data Synchronization" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f schemas/metadata/last-sync.json ]; then
            SYNCED=$(jq -r '.syncedCount' schemas/metadata/last-sync.json)
            FAILED=$(jq -r '.failedCount' schemas/metadata/last-sync.json)
            TOTAL=$(jq -r '.totalFiles' schemas/metadata/last-sync.json)
            
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Total CSV Files**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Successfully Synced**: ✅ $SYNCED" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: ❌ $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILED" -gt 0 ]; then
              echo "### ⚠️ Sync Failures" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
              jq '.failures' schemas/metadata/last-sync.json >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Synced CSV Files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.schemas[] | "- " + .localPath + " (" + (.size / 1024 | floor | tostring) + " KB)"' schemas/metadata/last-sync.json >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Sync failed - no metadata generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Sync timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> $GITHUB_STEP_SUMMARY

      - name: Upload sync metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-metadata
          path: schemas/metadata/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit synced CSV data files
        if: steps.sync.outputs.synced != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add updated CSV files (both data directories)
          git add cia-data/ data/cia/
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No CSV data changes detected"
          else
            git commit -m "chore: Sync CIA CSV data files from upstream" \
                       -m "" \
                       -m "Updated existing CSV file(s) from CIA repository sample-data" \
                       -m "Source https://github.com/Hack23/cia/tree/master/service.data.impl/sample-data" \
                       -m "" \
                       -m "Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            
            git push
            echo "✅ CSV data files committed and pushed"
          fi

      - name: Check sync status
        if: always()
        run: |
          FAILED="${{ steps.sync.outputs.failed }}"
          if [ "$FAILED" != "0" ]; then
            echo "⚠️ Some schemas failed to sync"
            echo "Please review the sync metadata artifact for details"
            # Don't fail the build - just warn
            # exit 1
          else
            echo "✅ All schemas synced successfully"
          fi
