name: Playwright Visual Regression Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'index*.html'
      - 'dashboard/**'
      - 'js/**'
      - 'styles.css'
      - 'tests/visual-regression/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-visual.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'index*.html'
      - 'dashboard/**'
      - 'js/**'
      - 'styles.css'
      - 'tests/visual-regression/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update baseline snapshots'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  playwright-visual:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Build with Vite
        run: npm run build

      - name: Run Playwright Structure Validation Tests
        run: |
          PLAYWRIGHT_SKIP_WEBSERVER=false \
          npx playwright test tests/visual-regression/dashboards.spec.js \
            --grep "Dashboard Structure Validation" \
            --project="Desktop Chrome" \
            --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        continue-on-error: true

      - name: Run Playwright Visual Regression Tests (Update Snapshots)
        if: github.event.inputs.update_snapshots == 'true'
        run: |
          npx playwright test tests/visual-regression/dashboards.spec.js \
            --update-snapshots \
            --project="Desktop Chrome" \
            --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        continue-on-error: true

      - name: Run Playwright Visual Regression Tests
        if: github.event.inputs.update_snapshots != 'true'
        run: |
          npx playwright test tests/visual-regression/dashboards.spec.js \
            --project="Desktop Chrome" \
            --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Visual Diff Screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

      - name: Upload Baseline Screenshots
        if: github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-baselines
          path: tests/visual-regression/**/*.png
          retention-days: 30

      - name: Test Summary
        if: always()
        run: |
          echo "## 🎭 Playwright Visual Regression Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboards tested**: 9 (all variants)" >> $GITHUB_STEP_SUMMARY
          echo "- **Viewports**: Desktop (1440px), Tablet (768px), Mobile (375px)" >> $GITHUB_STEP_SUMMARY
          echo "- **RTL layouts**: Arabic, Hebrew" >> $GITHUB_STEP_SUMMARY
          echo "- **CJK languages**: Japanese, Korean, Chinese" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Full report uploaded as artifact: playwright-report" >> $GITHUB_STEP_SUMMARY
