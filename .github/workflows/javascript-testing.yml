name: JavaScript Testing

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'cypress.config.js'
      - 'tests/**'
      - 'cypress/**'
      - '.github/workflows/javascript-testing.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'cypress.config.js'
      - 'tests/**'
      - 'cypress/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Vitest Unit Tests
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5d1ea1699fd8b19e52cd6d8dfb1bb6aa94be3e5f # v2.11.1
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Vitest unit tests
        run: npm run test:coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@5cd78f23119dd009b3d6a93ce24e0f9d65a80754 # v5.3.0
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: vitest-coverage
          fail_ci_if_error: false
      
      - name: Archive coverage results
        uses: actions/upload-artifact@4b3e3d77b02b231558f806c3e3359c900c01ef58 # v4.6.0
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
  
  # Vite Build Test
  build-test:
    name: Build Test (Vite)
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5d1ea1699fd8b19e52cd6d8dfb1bb6aa94be3e5f # v2.11.1
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        run: npm run build
      
      - name: Check build output
        run: |
          ls -la dist/
          echo "✅ Build completed successfully"
      
      - name: Archive build artifacts
        uses: actions/upload-artifact@4b3e3d77b02b231558f806c3e3359c900c01ef58 # v4.6.0
        with:
          name: build-dist
          path: dist/
          retention-days: 30
  
  # Cypress E2E Tests
  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: build-test
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5d1ea1699fd8b19e52cd6d8dfb1bb6aa94be3e5f # v2.11.1
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-dist
          path: dist/
      
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@8c5c69c5aacddb4017bc9ed4f24bf7d3a1f1e0ab # v6.9.1
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 60
          browser: chrome
          headless: true
      
      - name: Archive Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@4b3e3d77b02b231558f806c3e3359c900c01ef58 # v4.6.0
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 30
      
      - name: Archive Cypress videos
        if: always()
        uses: actions/upload-artifact@4b3e3d77b02b231558f806c3e3359c900c01ef58 # v4.6.0
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 30
  
  # Summary Report
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, build-test, e2e-tests]
    if: always()
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5d1ea1699fd8b19e52cd6d8dfb1bb6aa94be3e5f # v2.11.1
        with:
          egress-policy: audit
      
      - name: Test Results Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests (Vitest)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Test (Vite)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Tests (Cypress)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.build-test.result }}" == "success" ] && \
             [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "### ✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
