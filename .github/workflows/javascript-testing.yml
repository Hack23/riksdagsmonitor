name: TypeScript & JavaScript Testing

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**/*.ts'
      - '**/*.js'
      - 'src/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'cypress.config.js'
      - 'tests/**'
      - 'cypress/**'
      - '.github/workflows/javascript-testing.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.ts'
      - '**/*.js'
      - 'src/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'cypress.config.js'
      - 'tests/**'
      - 'cypress/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Vitest Unit Tests
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type-check (browser)
        run: npx tsc --project tsconfig.browser.json --noEmit
      
      - name: TypeScript type-check (scripts)
        run: npx tsc --project tsconfig.scripts.json --noEmit
      
      - name: Generate TypeDoc API documentation
        run: npm run typedoc
      
      - name: Run Vitest unit tests
        run: npm run test:coverage
      
      - name: Archive coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
  
  # Vite Build Test
  build-test:
    name: Build Test (Vite)
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        # The static-pages-emit plugin (scripts/vite-plugin-static-
        # pages.js) keeps the ~3 500 news/*.html, sitemap_*.html and
        # political-intelligence_*.html pages out of Rollup's module
        # graph; the build now needs <1 GB heap on the current corpus,
        # well under Node's default ~4 GB.
        run: npm run build
      
      - name: Check build output
        run: |
          ls -la dist/
          echo "✅ Build completed successfully"
      
      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-dist
          path: dist/
          retention-days: 30
  
  # Multi-Language Sanity Tests
  # (Other E2E tests moved to separate workflows: test-homepage.yml, test-dashboard.yml, test-news.yml)
  multi-language-tests:
    name: Multi-Language Sanity Tests
    runs-on: ubuntu-latest
    needs: build-test
    # This job covers homepage + dashboard + news across all 14 languages
    # (~3× the work of the per-page Cypress jobs), so it needs a larger budget
    # than the 5-minute per-page jobs. The previous 5-minute timeout caused
    # repeated cancellations on both PRs and main (see run 3064).
    timeout-minutes: 15
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cdn.cypress.io:443
            codeload.github.com:443
            download.cypress.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-dist
          path: dist/
      
      - name: Run Multi-Language Tests
        uses: cypress-io/github-action@b7a7441d775af8f8b9d19945c10dd689a51dba68 # v7.2.0
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30
          browser: chrome
          spec: 'cypress/e2e/multi-language-sanity.cy.js'
          config: video=false
          quiet: true
      
      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-language-screenshots
          path: cypress/screenshots/
          retention-days: 7
  
  # Node.js 27 Nightly Compatibility Check
  # Runs unit tests against the Node.js 27 nightly build to give early warning
  # of breaking changes before Node 27 becomes current. Never blocks the pipeline.
  node-next-compat:
    name: Node.js 27 Nightly Compat
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js 27 nightly
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '27-nightly'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-engines
      
      - name: TypeScript type-check (browser)
        run: npx tsc --project tsconfig.browser.json --noEmit
      
      - name: TypeScript type-check (scripts)
        run: npx tsc --project tsconfig.scripts.json --noEmit
      
      - name: Run Vitest unit tests
        run: npm run test

  # Summary Report
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, build-test, multi-language-tests, node-next-compat]
    if: always()
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      
      - name: Test Results Summary
        run: |
          echo "## 🧪 Core Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests (Vitest)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Test (Vite)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Multi-Language Tests" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.multi-language-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js 27 Nightly Compat (non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.node-next-compat.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Section-specific E2E tests run in separate workflows:" >> $GITHUB_STEP_SUMMARY
          echo "- 🏠 Homepage: test-homepage.yml" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Dashboard: test-dashboard.yml" >> $GITHUB_STEP_SUMMARY
          echo "- 📰 News: test-news.yml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.build-test.result }}" == "success" ] && \
             [ "${{ needs.multi-language-tests.result }}" == "success" ]; then
            echo "### ✅ All core tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
