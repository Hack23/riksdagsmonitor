name: TypeScript & JavaScript Testing

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**/*.ts'
      - '**/*.js'
      - 'src/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'cypress.config.js'
      - 'tests/**'
      - 'cypress/**'
      - '.github/workflows/javascript-testing.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/*.ts'
      - '**/*.js'
      - 'src/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'cypress.config.js'
      - 'tests/**'
      - 'cypress/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Vitest Unit Tests
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type-check (browser)
        run: npx tsc --project tsconfig.browser.json --noEmit
      
      - name: TypeScript type-check (scripts)
        run: npx tsc --project tsconfig.scripts.json --noEmit
      
      - name: Generate TypeDoc API documentation
        run: npm run typedoc
      
      - name: Run Vitest unit tests
        run: npm run test:coverage
      
      - name: Archive coverage results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
  
  # Vite Build Test
  build-test:
    name: Build Test (Vite)
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        run: npm run build
      
      - name: Check build output
        run: |
          ls -la dist/
          echo "✅ Build completed successfully"
      
      - name: Archive build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-dist
          path: dist/
          retention-days: 30
  
  # Multi-Language Sanity Tests
  # (Other E2E tests moved to separate workflows: test-homepage.yml, test-dashboard.yml, test-news.yml)
  multi-language-tests:
    name: Multi-Language Sanity Tests
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 5 # Max 5 minutes
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: build-dist
          path: dist/
      
      - name: Run Multi-Language Tests
        uses: cypress-io/github-action@bc22e01685c56e89e7813fd8e26f33dc47f87e15 # v7.1.5
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30
          browser: chrome
          spec: 'cypress/e2e/multi-language-sanity.cy.js'
          config: video=false
          quiet: true
      
      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: multi-language-screenshots
          path: cypress/screenshots/
          retention-days: 7
  
  # Summary Report
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, build-test, multi-language-tests]
    if: always()
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      
      - name: Test Results Summary
        run: |
          echo "## 🧪 Core Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests (Vitest)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Test (Vite)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Multi-Language Tests" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.multi-language-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Section-specific E2E tests run in separate workflows:" >> $GITHUB_STEP_SUMMARY
          echo "- 🏠 Homepage: test-homepage.yml" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Dashboard: test-dashboard.yml" >> $GITHUB_STEP_SUMMARY
          echo "- 📰 News: test-news.yml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.build-test.result }}" == "success" ] && \
             [ "${{ needs.multi-language-tests.result }}" == "success" ]; then
            echo "### ✅ All core tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
