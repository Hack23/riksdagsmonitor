name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  GITHUB_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
  GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
  COPILOT_GITHUB_TOKEN : ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Permissions for the setup-steps job.
    # `administration: write` is required to update repository rulesets so that
    # the Copilot SWE agent can be granted bypass permissions on branch rules.
    # Copilot will be given its own separate token for its coding operations.
    permissions:
      contents: read
      actions: read
      attestations: read
      checks: read
      deployments: read
      issues: write
      models: read
      discussions: read
      pages: read
      pull-requests: write
      security-events: read
      statuses: read
      administration: write

    # Steps run before the agent starts working
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Grant Copilot SWE agent bypass permissions on all repository rulesets.
      # The Copilot SWE agent (GitHub App ID 1143301) needs pull_request bypass on
      # rulesets that include the default branch (e.g. copilot_code_review rules)
      # so it can create PRs without being blocked. This step is idempotent.
      - name: Grant Copilot agent bypass permissions on branch rulesets
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          COPILOT_SWE_APP_ID=1143301

          echo "🔒 Fetching repository rulesets for $REPO..."
          RULESETS=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/rulesets" 2>&1) || {
              echo "⚠️  Could not fetch rulesets (token may lack administration scope) — skipping"
              exit 0
            }

          # Check if jq is available; fall back to Python
          if ! command -v jq &>/dev/null; then
            echo "ℹ️  jq not found, using Python for JSON processing"
            RULESET_IDS=$(echo "$RULESETS" | python3 -c "
          import json, sys
          rs = json.load(sys.stdin)
          if isinstance(rs, list):
              for r in rs:
                  print(r['id'])
          ")
          else
            RULESET_IDS=$(echo "$RULESETS" | jq -r '.[].id // empty')
          fi

          if [ -z "$RULESET_IDS" ]; then
            echo "ℹ️  No rulesets found — nothing to update"
            exit 0
          fi

          for RS_ID in $RULESET_IDS; do
            echo "📋 Checking ruleset ID $RS_ID..."
            RS_JSON=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/rulesets/$RS_ID") || {
                echo "⚠️  Could not fetch ruleset $RS_ID — skipping"
                continue
              }

            # Check if bypass actor already present
            ALREADY_BYPASSED=$(echo "$RS_JSON" | python3 -c "
          import json, sys
          rs = json.load(sys.stdin)
          actors = rs.get('bypass_actors', [])
          found = any(
              str(a.get('actor_id')) == '$COPILOT_SWE_APP_ID' and a.get('actor_type') == 'Integration'
              for a in actors
          )
          print('yes' if found else 'no')
          ")

            RS_NAME=$(echo "$RS_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('name','unknown'))")

            if [ "$ALREADY_BYPASSED" = "yes" ]; then
              echo "  ✅ '$RS_NAME': Copilot SWE agent bypass already configured"
              continue
            fi

            echo "  🔧 Adding Copilot SWE agent bypass to '$RS_NAME'..."

            # Build updated payload: keep existing fields, add bypass actor
            PAYLOAD=$(echo "$RS_JSON" | python3 -c "
          import json, sys
          rs = json.load(sys.stdin)
          # Remove read-only fields that cannot be sent back
          for key in ('id','source_type','source','node_id','created_at','updated_at','_links','current_user_can_bypass'):
              rs.pop(key, None)
          # Add bypass actor
          actors = rs.get('bypass_actors', [])
          actors.append({'actor_id': $COPILOT_SWE_APP_ID, 'actor_type': 'Integration', 'bypass_mode': 'pull_request'})
          rs['bypass_actors'] = actors
          print(json.dumps(rs))
          ")

            RESULT=$(curl -sf -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/rulesets/$RS_ID" \
              -d "$PAYLOAD" 2>&1) && {
                UPDATED_BYPASS_COUNT=$(echo "$RESULT" | python3 -c "import json,sys; r=json.load(sys.stdin); print(len(r.get('bypass_actors',[])))" 2>/dev/null || echo "?")
                echo "  ✅ '$RS_NAME': bypass granted (total bypass actors: $UPDATED_BYPASS_COUNT)"
              } || {
                echo "  ⚠️  Could not update ruleset '$RS_NAME' (token may lack administration scope)"
                echo "      Manual fix: go to https://github.com/$REPO/rules/$RS_ID"
                echo "      Add 'GitHub Apps > copilot-swe-agent' to the Bypass list"
              }
          done

          echo "🎉 Ruleset bypass check complete"

      # Cache APT packages for faster installs
      - name: Cache APT packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/copilot-setup-steps.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # Setup environment
      - name: Setup Environment
        run: |
          echo "🔧 Setting up environment..."

          # Install system dependencies for Web rendering
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz python3
                    
          echo "✅ environment setup complete"
 
      # JavaScript/TypeScript setup
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "25"
  
      - name: Cache dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # Pre-install MCP server packages globally
      - name: Install MCP server packages globally
        run: |
          echo "📦 Installing MCP server packages globally..."
          
          # Install Node.js MCP servers that exist on npm
          npm install -g @modelcontextprotocol/server-filesystem
          npm install -g @modelcontextprotocol/server-memory
          npm install -g @modelcontextprotocol/server-sequential-thinking
          
          # Pre-cache @playwright/mcp for faster startup
          npm install -g @playwright/mcp
          
          # Install World Bank MCP server for economic data
          npm install -g worldbank-mcp@1.0.1
          
          # Install PxWeb MCP server for SCB (Statistics Sweden) data
          npm install -g @jarib/pxweb-mcp@2.0.0
          
          echo "✅ Node.js MCP server packages installed globally"

      # Cache global npm packages for MCP servers
      - name: Cache global npm packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules
            /usr/local/bin/mcp-server-*
          key: ${{ runner.os }}-mcp-servers-v4-${{ hashFiles('.github/copilot-mcp.json') }}
          restore-keys: |
            ${{ runner.os }}-mcp-servers-v4-

      # Verify all MCP server installations
      - name: Verify MCP server installations
        run: |
          echo "🔍 Verifying MCP server installations..."
          
          echo "=== Node.js MCP Servers ==="
          echo "Checking mcp-server-filesystem..."
          which mcp-server-filesystem && echo "✅ mcp-server-filesystem found" || echo "❌ mcp-server-filesystem NOT found"
          
          echo "Checking mcp-server-memory..."
          which mcp-server-memory && echo "✅ mcp-server-memory found" || echo "❌ mcp-server-memory NOT found"
          
          echo "Checking mcp-server-sequential-thinking..."
          which mcp-server-sequential-thinking && echo "✅ mcp-server-sequential-thinking found" || echo "❌ mcp-server-sequential-thinking NOT found"
          
          echo "Checking @playwright/mcp..."
          which mcp-server-playwright 2>/dev/null && echo "✅ mcp-server-playwright found" || echo "ℹ️ @playwright/mcp available via npx"
          
          echo "Checking worldbank-mcp..."
          which worldbank-mcp && echo "✅ worldbank-mcp found" || echo "❌ worldbank-mcp NOT found"
          
          echo "Checking @jarib/pxweb-mcp..."
          which pxweb-mcp && echo "✅ pxweb-mcp (SCB) found" || echo "❌ pxweb-mcp NOT found"
                    
          echo ""
          echo "=== HTTP MCP Servers ==="
          echo "📍 GitHub MCP Server: Using HTTP endpoint (https://api.githubcopilot.com/mcp/insiders)"
          echo "📍 Riksdag-Regering MCP Server: Using HTTP endpoint (https://riksdag-regering-ai.onrender.com/mcp)"
          echo "=== Local stdio MCP Servers ==="
          echo "📍 World Bank MCP Server: worldbank-mcp (stdio)"
          echo "📍 SCB MCP Server: @jarib/pxweb-mcp --url https://api.scb.se/OV0104/v2beta (stdio)"
          echo "✅ MCP server verification complete"
