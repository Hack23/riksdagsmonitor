name: Regenerate Articles

# Manually regenerate every `article.md` (via aggregate-analysis) and every
# `news/$DATE-$SUBFOLDER-$LANG.html` page (via render-articles, all 14 languages)
# from the current analysis/daily/ tree, then commit all changed files
# directly to `main`.
#
# Reference docs:
#   - Article-Generation.md (full pipeline)
#   - .github/workflows/compile-agentic-workflows.yml (commit-to-main pattern)
#
# This is the "deterministic rebuild" companion to the per-type news agentic
# workflows: no AI is invoked, only the aggregation + chrome/SEO renderer.
# Use it after changes to render-lib, aggregator, SEO contracts, chrome,
# language alternates, or any analysis artifact that affects the rendered
# article corpus.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate article.md + news HTML (all langs)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the final `git push` to main never hits a shallow
          # prerequisite-commit failure (mirrors compile-agentic-workflows.yml).
          fetch-depth: 0
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/regenerate-articles.yml

      - name: Install dependencies
        run: npm ci

      - name: Aggregate analysis → article.md (all subfolders)
        run: npx tsx scripts/aggregate-analysis.ts --all

      - name: Render articles → news/*.html (all subfolders, all 14 languages)
        run: npx tsx scripts/render-articles.ts --all --lang all

      - name: Commit regenerated articles to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage every generated/regenerated file across the analysis tree
          # (article.md siblings) and the rendered HTML corpus.
          git add analysis/ news/

          if git diff --cached --quiet; then
            echo "No regenerated files differ from the working tree — nothing to commit."
            exit 0
          fi

          git diff --cached --stat

          git commit -m "chore(articles): regenerate article.md and news HTML for all 14 languages

          Ran:
            - npx tsx scripts/aggregate-analysis.ts --all
            - npx tsx scripts/render-articles.ts --all --lang all

          Triggered manually via the Regenerate Articles workflow to refresh
          the deterministic article corpus from the current analysis/daily/
          tree and shared chrome/SEO pipeline."

          git push origin HEAD:main
