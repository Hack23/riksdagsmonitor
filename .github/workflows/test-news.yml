name: Test News

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'news/**'
      - 'sitemap*.html'
      - 'cypress/e2e/news-page.cy.js'
      - 'cypress/e2e/news-articles.cy.js'
      - 'cypress/e2e/sitemap.cy.js'
      - '.github/workflows/test-news.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'news/**'
      - 'sitemap*.html'
      - 'cypress/e2e/news-page.cy.js'
      - 'cypress/e2e/news-articles.cy.js'
      - 'cypress/e2e/sitemap.cy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for News Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        env:
          # Vite renders ~4,200 modules and ~3,500 HTML entries; the
          # default ~1.7 GB Node heap OOMs during `rendering chunks`.
          # Mirror the heap size used by deploy-s3.yml so PR builds
          # succeed for the same workload that ships to S3.
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: news-build
          path: dist/
          retention-days: 1
  
  test-news:
    name: News & Sitemap Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5 # Max 5 minutes
    strategy:
      fail-fast: true # Stop immediately on failure
      matrix:
        spec:
          - 'cypress/e2e/news-page.cy.js'
          - 'cypress/e2e/news-articles.cy.js'
          - 'cypress/e2e/sitemap.cy.js'
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: news-build
          path: dist/
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@c495c3ddffba403ba11be95fffb67e25203b3799 # v7.1.10
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30
          browser: chrome
          spec: ${{ matrix.spec }}
          config: video=false
          quiet: true
      
      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: news-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots/
          retention-days: 7
  
  summary:
    name: News Test Summary
    runs-on: ubuntu-latest
    needs: [build, test-news]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 📰 News Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test-news.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-news.result }}" == "success" ]; then
            echo "### ✅ All news tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ News tests failed" >> $GITHUB_STEP_SUMMARY
          fi
