name: Test Dashboard

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/browser/**'
      - 'dashboard/**'
      - 'cypress/e2e/dashboard-page.cy.js'
      - 'cypress/e2e/dashboards.cy.js'
      - 'cypress/e2e/politician-dashboard.cy.js'
      - '.github/workflows/test-dashboard.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/browser/**'
      - 'dashboard/**'
      - 'cypress/e2e/dashboard-page.cy.js'
      - 'cypress/e2e/dashboards.cy.js'
      - 'cypress/e2e/politician-dashboard.cy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Dashboard Tests
    runs-on: ubuntu-26.04
    # Bumped from 10 → 15 after observing ~9m45s build times getting
    # cancelled at the 10-min cap on busier runners (see run #26052744369).
    timeout-minutes: 15
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/test-dashboard.yml
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      
      - name: Build with Vite
        # The static-pages-emit plugin (scripts/vite-plugin-static-
        # pages.js) keeps the ~3 500 news/*.html, sitemap_*.html and
        # political-intelligence_*.html pages out of Rollup's module
        # graph; the build now needs <1 GB heap on the current corpus,
        # well under Node's default ~4 GB.
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-build
          path: dist/
          retention-days: 1
  
  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 5 # Max 5 minutes
    # Use the official Cypress browsers image so Chrome/Firefox/Edge are
    # preinstalled at known versions — eliminates cypress↔chrome version
    # drift. Node 26 is installed inside the container via
    # actions/setup-node because no Cypress image yet ships Node 26.
    # TODO: pin to an immutable @sha256: digest via Renovate.
    container:
      image: cypress/browsers:latest
      options: --user root

    # All three dashboard specs run in a single Cypress invocation. The
    # previous design used a 3-way matrix, which spent ~1-2 min on
    # `npm ci` + preview start + cypress boot PER spec — 4-6 min of
    # redundant setup. A single invocation runs the same three specs
    # sequentially in ~60-90s wall-clock without changing test
    # semantics (each spec still runs in its own isolated Cypress
    # process).

    steps:
      # NOTE: step-security/harden-runner is host-level and is not
      # compatible with container jobs, so this job runs WITHOUT
      # runtime egress restrictions — accepted trade-off for browser
      # version determinism. The harden-runner build job above still
      # gates the artifacts this job consumes, but does not enforce
      # outbound restrictions for this job at runtime.

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/test-dashboard.yml

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-build
          path: dist/

      - name: Run Cypress tests (all dashboard specs)
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30
          browser: chrome
          spec: 'cypress/e2e/dashboard-page.cy.js,cypress/e2e/dashboards.cy.js,cypress/e2e/politician-dashboard.cy.js'
          config: video=false
          quiet: true
          # Skip the action's bundled `npm install` — we already ran
          # `npm ci` above and the container ships browsers preinstalled.
          install: false

      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-screenshots
          path: cypress/screenshots/
          retention-days: 7
          if-no-files-found: ignore
  
  summary:
    name: Dashboard Test Summary
    runs-on: ubuntu-26.04
    needs: [build, test-dashboard]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 📊 Dashboard Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test-dashboard.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-dashboard.result }}" == "success" ]; then
            echo "### ✅ All dashboard tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Dashboard tests failed" >> $GITHUB_STEP_SUMMARY
          fi
