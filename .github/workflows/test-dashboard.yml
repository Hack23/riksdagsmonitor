name: Test Dashboard

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/browser/**'
      - 'dashboard/**'
      - 'cypress/e2e/dashboard-page.cy.js'
      - 'cypress/e2e/dashboards.cy.js'
      - 'cypress/e2e/politician-dashboard.cy.js'
      - '.github/workflows/test-dashboard.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/browser/**'
      - 'dashboard/**'
      - 'cypress/e2e/dashboard-page.cy.js'
      - 'cypress/e2e/dashboards.cy.js'
      - 'cypress/e2e/politician-dashboard.cy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dashboard-build
          path: dist/
          retention-days: 1
  
  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5 # Max 5 minutes
    strategy:
      fail-fast: true # Stop immediately on failure
      matrix:
        spec:
          - 'cypress/e2e/dashboard-page.cy.js'
          - 'cypress/e2e/dashboards.cy.js'
          - 'cypress/e2e/politician-dashboard.cy.js'
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dashboard-build
          path: dist/
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@bc22e01685c56e89e7813fd8e26f33dc47f87e15 # v7.1.5
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30
          browser: chrome
          spec: ${{ matrix.spec }}
          config: video=false
          quiet: true
      
      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dashboard-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots/
          retention-days: 7
  
  summary:
    name: Dashboard Test Summary
    runs-on: ubuntu-latest
    needs: [build, test-dashboard]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 📊 Dashboard Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test-dashboard.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-dashboard.result }}" == "success" ]; then
            echo "### ✅ All dashboard tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Dashboard tests failed" >> $GITHUB_STEP_SUMMARY
          fi
