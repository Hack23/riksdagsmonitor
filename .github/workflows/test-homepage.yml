name: Test Homepage

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'index*.html'
      - 'styles.css'
      - 'src/browser/**'
      - 'cypress/e2e/homepage.cy.js'
      - 'cypress/e2e/accessibility.cy.js'
      - '.github/workflows/test-homepage.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'index*.html'
      - 'styles.css'
      - 'src/browser/**'
      - 'cypress/e2e/homepage.cy.js'
      - 'cypress/e2e/accessibility.cy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Homepage Tests
    runs-on: ubuntu-26.04
    # Bumped 10 → 15 → 20 → 25. Same `npm run build` as test-news.yml: it
    # renders ~5 400 pages (391 subfolders × 14 languages) in ~14m42s
    # (run #26603785540 "Build Test (Vite)" step), so the full job runs
    # ~17min. The previous caps were cancelled mid-render; 25 gives
    # durable headroom as the news corpus keeps growing.
    timeout-minutes: 25
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/test-homepage.yml
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      
      - name: Build with Vite
        # The static-pages-emit plugin (scripts/vite-plugin-static-
        # pages.js) keeps the ~3 500 news/*.html, sitemap_*.html and
        # political-intelligence_*.html pages out of Rollup's module
        # graph; the build now needs <1 GB heap on the current corpus,
        # well under Node's default ~4 GB.
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-build
          path: dist/
          retention-days: 1 # Short retention for speed
  
  test-homepage:
    name: Homepage & Accessibility Tests
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 5 # Max 5 minutes
    # Use the official Cypress browsers image so Chrome/Firefox/Edge are
    # preinstalled at known versions — eliminates the previous risk of
    # cypress↔chrome version drift when GitHub-hosted runner images are
    # bumped. Node 26 is installed inside the container via
    # actions/setup-node because no Cypress image yet ships Node 26.
    # TODO: pin to an immutable @sha256: digest via Renovate.
    container:
      image: cypress/browsers:latest
      options: --user root

    # Both specs run in a single Cypress invocation (was a 2-way matrix).
    # See test-dashboard.yml for rationale: per-spec matrix wasted 1-2 min
    # of `npm ci` + preview start + cypress boot for ~30s of actual tests.

    steps:
      # NOTE: step-security/harden-runner is a host-level action and is
      # not compatible with container jobs, so this job runs WITHOUT
      # runtime egress restrictions — accepted trade-off for browser
      # version determinism. The harden-runner build job above still
      # gates the artifacts this job consumes, but does not enforce
      # outbound restrictions for this job at runtime.

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/test-homepage.yml

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homepage-build
          path: dist/

      - name: Run Cypress tests (homepage + a11y)
        uses: cypress-io/github-action@948d67d3074f1bbb6379c8bdbb04e95d2f8e593f # v7.4.0
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30 # Reduced from 60 for speed
          browser: chrome
          spec: 'cypress/e2e/homepage.cy.js,cypress/e2e/accessibility.cy.js'
          config: video=false
          quiet: true
          # Skip the action's bundled `npm install` — we already ran
          # `npm ci` above and the container ships browsers preinstalled.
          install: false # Faster output

      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-screenshots
          path: cypress/screenshots/
          retention-days: 7
          if-no-files-found: ignore
  
  summary:
    name: Homepage Test Summary
    runs-on: ubuntu-26.04
    needs: [build, test-homepage]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 🏠 Homepage Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test-homepage.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-homepage.result }}" == "success" ]; then
            echo "### ✅ All homepage tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Homepage tests failed" >> $GITHUB_STEP_SUMMARY
          fi
