name: Test Homepage

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'index*.html'
      - 'styles.css'
      - 'src/browser/**'
      - 'cypress/e2e/homepage.cy.js'
      - 'cypress/e2e/accessibility.cy.js'
      - 'cypress/e2e/wcag-axe.cy.js'
      - 'cypress/axe-config.js'
      - '.github/workflows/test-homepage.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'index*.html'
      - 'styles.css'
      - 'src/browser/**'
      - 'cypress/e2e/homepage.cy.js'
      - 'cypress/e2e/accessibility.cy.js'
      - 'cypress/e2e/wcag-axe.cy.js'
      - 'cypress/axe-config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Homepage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-build
          path: dist/
          retention-days: 1 # Short retention for speed
  
  test-homepage:
    name: Homepage & Accessibility Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5 # Max 5 minutes
    strategy:
      fail-fast: true # Stop immediately on failure
      matrix:
        spec:
          - 'cypress/e2e/homepage.cy.js'
          - 'cypress/e2e/accessibility.cy.js'
          - 'cypress/e2e/wcag-axe.cy.js'
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homepage-build
          path: dist/
      
      - name: Run Cypress tests
        uses: cypress-io/github-action@783cb3f07983868532cabaedaa1e6c00ff4786a8 # v7.1.9
        with:
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30 # Reduced from 60 for speed
          browser: chrome
          spec: ${{ matrix.spec }}
          config: video=false
          quiet: true # Faster output
      
      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots/
          retention-days: 7
  
  summary:
    name: Homepage Test Summary
    runs-on: ubuntu-latest
    needs: [build, test-homepage]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## 🏠 Homepage Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test-homepage.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-homepage.result }}" == "success" ]; then
            echo "### ✅ All homepage tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Homepage tests failed" >> $GITHUB_STEP_SUMMARY
          fi
