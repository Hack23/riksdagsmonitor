name: Automated News Generation

on:
  schedule:
    # Morning briefing: 06:00 UTC (07:00 CET) - calendar, week-ahead
    - cron: '0 6 * * 1-5'
    # Midday update: 12:00 UTC (13:00 CET) - committee reports, propositions, motions
    - cron: '0 12 * * 1-5'
    # Evening wrap-up: 18:00 UTC (19:00 CET) - all types, full analysis
    - cron: '0 18 * * 1-5'
    # Weekend summary: 10:00 UTC Saturday
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      force_generation:
        description: 'Force news generation even if no new content'
        type: boolean
        default: false
        required: false
      article_types:
        description: 'Comma-separated article types to generate (week-ahead,committee-reports,propositions,motions,breaking)'
        type: string
        default: 'week-ahead'
        required: false
      languages:
        description: 'Languages to generate (en,sv | nordic | eu-core | all | custom comma-separated)'
        type: string
        default: 'en,sv'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-news:
    name: Generate News Articles
    runs-on: ubuntu-latest
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          
          # Install jq for JSON processing
          sudo apt-get update && sudo apt-get install -y jq
          
          npm ci --prefer-offline --no-audit
          
          # Install riksdag-regering-mcp for data access
          npm install -g riksdag-regering-mcp
          echo "✅ Dependencies installed"
      
      - name: Check for new Riksdag/Regering updates
        id: check-updates
        run: |
          echo "🔍 Checking for new Riksdag/Regering updates..."
          
          # Store current timestamp
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "current_time=$CURRENT_TIME" >> $GITHUB_OUTPUT
          
          # Check last generation time
          if [ -f "news/metadata/last-generation.json" ]; then
            LAST_GEN=$(jq -r '.timestamp' news/metadata/last-generation.json)
            echo "last_generation=$LAST_GEN" >> $GITHUB_OUTPUT
            echo "📊 Last generation: $LAST_GEN"
          else
            echo "last_generation=never" >> $GITHUB_OUTPUT
            echo "ℹ️ No previous generation found"
          fi
          
          # Determine if we should generate news
          if [ "${{ github.event.inputs.force_generation }}" = "true" ]; then
            echo "should_generate=true" >> $GITHUB_OUTPUT
            echo "✅ Force generation enabled"
          else
            # Check if it's been more than 5 hours since last generation
            if [ -f "news/metadata/last-generation.json" ]; then
              HOURS_AGO=$(( ($(date +%s) - $(date -d "$LAST_GEN" +%s)) / 3600 ))
              if [ $HOURS_AGO -gt 5 ]; then
                echo "should_generate=true" >> $GITHUB_OUTPUT
                echo "✅ More than 5 hours since last generation ($HOURS_AGO hours)"
              else
                echo "should_generate=false" >> $GITHUB_OUTPUT
                echo "ℹ️ Recent generation found ($HOURS_AGO hours ago), skipping"
              fi
            else
              echo "should_generate=true" >> $GITHUB_OUTPUT
              echo "✅ First generation"
            fi
          fi
      
      - name: Check for recent agentic workflow activity
        if: steps.check-updates.outputs.should_generate == 'true'
        id: check-agentic
        run: |
          echo "🤖 Checking for recent agentic workflow activity..."
          
          # Portable timestamp parsing function (GNU date, BSD date, Python fallback)
          parse_timestamp() {
            local input="$1"
            
            # Try GNU date (-d option)
            if ts=$(date -d "$input" +%s 2>/dev/null); then
              echo "$ts"
              return 0
            fi
            
            # Try BSD date (-j -f option) for ISO8601
            if ts=$(date -j -f '%Y-%m-%dT%H:%M:%SZ' "$input" +%s 2>/dev/null); then
              echo "$ts"
              return 0
            fi
            
            # Fallback to Python for cross-platform compatibility
            if command -v python3 >/dev/null 2>&1; then
              if ts=$(python3 -c "
import sys
from datetime import datetime
try:
    dt = datetime.fromisoformat('$input'.replace('Z', '+00:00'))
    print(int(dt.timestamp()))
except:
    sys.exit(1)
" 2>/dev/null); then
                echo "$ts"
                return 0
              fi
            fi
            
            return 1
          }
          
          if [ -f "news/metadata/workflow-state.json" ]; then
            # Check if agentic workflows generated content recently (< 2 hours)
            LAST_AGENTIC=$(jq -r '.lastUpdate // empty' news/metadata/workflow-state.json)
            
            if [ -n "$LAST_AGENTIC" ]; then
              # Safely parse lastUpdate and guard against invalid or future timestamps
              if PARSED_AGENTIC_TS=$(parse_timestamp "$LAST_AGENTIC"); then
                NOW_TS=$(date +%s)
                
                # Check for future timestamp (clock skew or invalid data)
                if [ "$PARSED_AGENTIC_TS" -gt "$NOW_TS" ]; then
                  # Future timestamp - treat as invalid, not recent
                  echo "agentic_recent=false" >> $GITHUB_OUTPUT
                  echo "⚠️ Future timestamp in workflow state (clock skew?), proceeding with traditional workflow"
                else
                  # Valid past timestamp - calculate hours ago
                  HOURS_AGO=$(( (NOW_TS - PARSED_AGENTIC_TS) / 3600 ))
                  
                  if [ "$HOURS_AGO" -lt 2 ]; then
                    echo "agentic_recent=true" >> $GITHUB_OUTPUT
                    echo "✅ Agentic workflows active (${HOURS_AGO}h ago), skipping traditional workflow"
                  else
                    echo "agentic_recent=false" >> $GITHUB_OUTPUT
                    echo "ℹ️ No recent agentic activity (${HOURS_AGO}h ago), proceeding with traditional workflow"
                  fi
                fi
              else
                # Unparseable timestamp
                echo "agentic_recent=false" >> $GITHUB_OUTPUT
                echo "⚠️ Unparseable lastUpdate timestamp in workflow state, proceeding with traditional workflow"
              fi
            else
              echo "agentic_recent=false" >> $GITHUB_OUTPUT
              echo "ℹ️ Invalid lastUpdate in workflow state, proceeding with traditional workflow"
            fi
          else
            echo "agentic_recent=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No agentic workflow state found, proceeding with traditional workflow"
          fi
      
      - name: Generate news articles
        if: |
          steps.check-updates.outputs.should_generate == 'true' &&
          steps.check-agentic.outputs.agentic_recent != 'true'
        id: generate
        env:
          ARTICLE_TYPES: ${{ github.event.inputs.article_types || '' }}
          LANGUAGES: ${{ github.event.inputs.languages || '' }}
        run: |
          echo "📰 Generating news articles..."
          
          # Determine article types based on time-of-day if not manually specified
          if [ -z "$ARTICLE_TYPES" ]; then
            HOUR=$(date -u +"%H")
            DAY_OF_WEEK=$(date -u +"%u")  # 1=Monday, 7=Sunday
            
            if [ "$DAY_OF_WEEK" -ge 6 ]; then
              # Weekend: full analysis
              ARTICLE_TYPES="week-ahead,committee-reports,propositions,motions"
              echo "📅 Weekend schedule: full analysis"
            elif [ "$HOUR" -lt 9 ]; then
              # Morning (06:00 UTC): calendar & week-ahead
              ARTICLE_TYPES="week-ahead"
              echo "🌅 Morning schedule: week-ahead briefing"
            elif [ "$HOUR" -lt 15 ]; then
              # Midday (12:00 UTC): committee reports, propositions, motions
              ARTICLE_TYPES="committee-reports,propositions,motions"
              echo "☀️ Midday schedule: parliamentary activity"
            else
              # Evening (18:00 UTC): all types
              ARTICLE_TYPES="week-ahead,committee-reports,propositions,motions,breaking"
              echo "🌆 Evening schedule: comprehensive wrap-up"
            fi
          fi
          
          # Determine languages based on time slot if not manually specified
          if [ -z "$LANGUAGES" ]; then
            HOUR=$(date -u +"%H")
            if [ "$HOUR" -lt 9 ]; then
              # Morning: core languages for speed
              LANG_ARG="en,sv"
              echo "🌐 Morning: EN/SV for fast delivery"
            elif [ "$HOUR" -lt 15 ]; then
              # Midday: Nordic languages
              LANG_ARG="en,sv,da,no,fi"
              echo "🌐 Midday: Nordic languages"
            else
              # Evening: all 14 languages
              LANG_ARG="en,sv,da,no,fi,de,fr,es,nl,ar,he,ja,ko,zh"
              echo "🌐 Evening: all 14 languages"
            fi
          else
            # Manual override - expand presets
            case "$LANGUAGES" in
              "nordic")
                LANG_ARG="en,sv,da,no,fi"
                echo "🌍 Expanding 'nordic' to: $LANG_ARG"
                ;;
              "eu-core")
                LANG_ARG="en,sv,de,fr,es,nl"
                echo "🌍 Expanding 'eu-core' to: $LANG_ARG"
                ;;
              "all")
                LANG_ARG="en,sv,da,no,fi,de,fr,es,nl,ar,he,ja,ko,zh"
                echo "🌍 Expanding 'all' to all 14 languages"
                ;;
              *)
                LANG_ARG="$LANGUAGES"
                ;;
            esac
          fi
          
          echo "📋 Article types: $ARTICLE_TYPES"
          echo "🌐 Languages: $LANG_ARG"
          
          # Create metadata directory
          mkdir -p news/metadata
          
          # Check script exists before running
          if [ ! -f "scripts/generate-news-enhanced.js" ]; then
            echo "❌ CRITICAL ERROR: scripts/generate-news-enhanced.js not found"
            
            # Log structured error
            cat > news/metadata/errors.json <<EOF
          {
            "lastError": {
              "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "workflow": "news-generation.yml",
              "errorType": "script_missing",
              "message": "scripts/generate-news-enhanced.js not found",
              "severity": "critical",
              "retryable": false
            },
            "errorHistory": [
              {
                "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
                "workflow": "news-generation.yml",
                "errorType": "script_missing",
                "message": "scripts/generate-news-enhanced.js not found",
                "severity": "critical",
                "retryable": false
              }
            ]
          }
          EOF
            
            echo "generated=0" >> $GITHUB_OUTPUT
            echo "errors=1" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Run news generation script with error capture
          set +e
          node scripts/generate-news-enhanced.js --types="$ARTICLE_TYPES" --languages="$LANG_ARG" 2>&1 | tee generation.log
          EXIT_CODE=$?
          set -e
          
          # Handle script execution results
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Generation failed with exit code $EXIT_CODE"
            
            # Detect error type from logs
            if grep -q "MCP.*timeout" generation.log 2>/dev/null || grep -q "MCP.*unavailable" generation.log 2>/dev/null; then
              ERROR_TYPE="mcp_unavailable"
              ERROR_SEVERITY="warning"
              ERROR_MSG="riksdag-regering-mcp server timeout or unavailable"
            else
              ERROR_TYPE="script_failure"
              ERROR_SEVERITY="error"
              ERROR_MSG="News generation script failed with exit code $EXIT_CODE"
            fi
            
            # Log structured error
            cat > news/metadata/errors.json <<EOF
          {
            "lastError": {
              "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "workflow": "news-generation.yml",
              "errorType": "$ERROR_TYPE",
              "message": "$ERROR_MSG",
              "severity": "$ERROR_SEVERITY",
              "retryable": true
            },
            "errorHistory": [
              {
                "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
                "workflow": "news-generation.yml",
                "errorType": "$ERROR_TYPE",
                "message": "$ERROR_MSG",
                "severity": "$ERROR_SEVERITY",
                "retryable": true
              }
            ]
          }
          EOF
            
            echo "generated=0" >> $GITHUB_OUTPUT
            echo "errors=1" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Check results
          if [ -f "news/metadata/generation-result.json" ]; then
            GENERATED=$(jq -r '.generated' news/metadata/generation-result.json)
            ERRORS=$(jq -r '.errors' news/metadata/generation-result.json)
            
            echo "generated=$GENERATED" >> $GITHUB_OUTPUT
            echo "errors=$ERRORS" >> $GITHUB_OUTPUT
            echo "✅ Generated $GENERATED articles with $ERRORS errors"
          else
            echo "generated=0" >> $GITHUB_OUTPUT
            echo "errors=0" >> $GITHUB_OUTPUT
            echo "ℹ️ No articles generated (no new content available)"
          fi
      
      - name: Regenerate news indexes
        if: |
          steps.check-updates.outputs.should_generate == 'true' &&
          steps.check-agentic.outputs.agentic_recent != 'true'
        id: indexes
        run: |
          echo "🗂️ Regenerating news index files..."
          
          if [ -f "scripts/generate-news-indexes.js" ]; then
            node scripts/generate-news-indexes.js
            echo "✅ All 14 language index files regenerated"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ News index generation script not found"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update sitemap
        if: steps.generate.outputs.generated != '0' || steps.indexes.outputs.updated == 'true'
        id: sitemap
        run: |
          echo "🗺️ Updating sitemap.xml..."
          
          if [ -f "scripts/generate-sitemap.js" ]; then
            node scripts/generate-sitemap.js
            echo "✅ Sitemap updated"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Sitemap generation script not found"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update last generation timestamp
        if: steps.check-updates.outputs.should_generate == 'true'
        run: |
          echo "⏰ Updating last generation timestamp..."
          
          # Always update timestamp, even when 0 articles generated
          # This prevents repeated executions when no new content is available
          mkdir -p news/metadata
          
          # Preserve existing metadata fields (types, status, note) if file exists
          if [ -f "news/metadata/last-generation.json" ]; then
            # Update only timestamp/counters while preserving other fields
            CURRENT_TIME="${{ steps.check-updates.outputs.current_time }}"
            GENERATED="${{ steps.generate.outputs.generated || '0' }}"
            ERRORS="${{ steps.generate.outputs.errors || '0' }}"
            jq \
              --arg ts "$CURRENT_TIME" \
              --argjson gen "${GENERATED}" \
              --argjson err "${ERRORS}" \
              '.timestamp = $ts | .generated = $gen | .errors = $err' \
              news/metadata/last-generation.json > news/metadata/last-generation.tmp && \
              mv news/metadata/last-generation.tmp news/metadata/last-generation.json
          else
            # Create new metadata file using jq for safe JSON construction
            CURRENT_TIME="${{ steps.check-updates.outputs.current_time }}"
            GENERATED="${{ steps.generate.outputs.generated || '0' }}"
            ERRORS="${{ steps.generate.outputs.errors || '0' }}"
            jq -n \
              --arg ts "$CURRENT_TIME" \
              --argjson gen "${GENERATED}" \
              --argjson err "${ERRORS}" \
              '{timestamp: $ts, generated: $gen, errors: $err}' > news/metadata/last-generation.json
          fi
          
          echo "✅ Timestamp updated"
      
      - name: Commit timestamp update (when no articles generated)
        if: |
          steps.check-updates.outputs.should_generate == 'true' &&
          steps.check-agentic.outputs.agentic_recent != 'true' &&
          steps.generate.outputs.generated == '0'
        run: |
          echo "⏰ Committing timestamp update (0 articles generated)..."
          echo "ℹ️ This prevents infinite retry loops when no new content is available"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news/metadata/last-generation.json
          if git diff --staged --quiet; then
            echo "ℹ️ No timestamp changes to commit"
          else
            git commit -m "chore: Update news generation timestamp (no new content)"
            git push
            echo "✅ Timestamp committed - prevents retry loop"
          fi
      
      - name: Validate generated articles
        if: steps.generate.outputs.generated != '0'
        run: |
          echo "🔍 Validating generated HTML..."
          
          # Find newly generated articles (modified in last 5 minutes)
          GENERATED_FILES=$(find news -name "*.html" -type f -mmin -5)
          
          if [ -n "$GENERATED_FILES" ]; then
            echo "📄 Found generated files:"
            echo "$GENERATED_FILES"
            
            # Run HTML validation on generated files
            if command -v htmlhint &> /dev/null; then
              echo "$GENERATED_FILES" | xargs htmlhint || echo "⚠️ HTML validation warnings found"
            else
              echo "ℹ️ HTMLHint not available, skipping validation"
            fi
          else
            echo "ℹ️ No recently generated files found"
          fi
      
      - name: Generate workflow summary
        if: always()
        run: |
          echo "## 📰 News Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-updates.outputs.should_generate }}" = "true" ]; then
            echo "### ✅ Generation Status: EXECUTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Articles Generated**: ${{ steps.generate.outputs.generated }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: ${{ steps.generate.outputs.errors }}" >> $GITHUB_STEP_SUMMARY
            echo "- **News Indexes Updated**: ${{ steps.indexes.outputs.updated || 'false' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Sitemap Updated**: ${{ steps.sitemap.outputs.updated || 'false' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Timestamp**: ${{ steps.check-updates.outputs.current_time }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Generation Status: SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Recent generation found (< 11 hours old). Use manual trigger with force_generation to override." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Generation**: ${{ steps.check-updates.outputs.last_generation }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow execution: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> $GITHUB_STEP_SUMMARY
      
      - name: Create PR with generated articles
        if: |
          success() &&
          steps.generate.outcome == 'success' &&
          steps.generate.outputs.generated != '0' &&
          steps.generate.outputs.generated != ''
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'news: ${{ steps.generate.outputs.generated }} articles - ${{ steps.check-updates.outputs.current_time }}'
          title: '📰 ${{ steps.generate.outputs.generated }} News Articles - ${{ steps.check-updates.outputs.current_time }}'
          body: |
            ## Automated News Generation
            
            This PR contains automatically generated news articles from riksdag-regering-mcp data.
            
            ### Summary
            - **Articles Generated**: ${{ steps.generate.outputs.generated }}
            - **Article Types**: ${{ github.event.inputs.article_types || 'week-ahead (default)' }}
            - **Languages**: ${{ github.event.inputs.languages || 'en,sv (default)' }}
            - **Errors**: ${{ steps.generate.outputs.errors }}
            - **News Indexes**: ${{ steps.indexes.outputs.updated == 'true' && 'Regenerated (all 14 languages)' || 'Not updated' }}
            - **Sitemap Updated**: ${{ steps.sitemap.outputs.updated }}
            - **Generation Time**: ${{ steps.check-updates.outputs.current_time }}
            
            ### Data Sources
            - **riksdag-regering-mcp**: Swedish Parliament and Government data
            - **32 specialized tools**: Documents, MPs, votes, speeches, calendar events
            
            ### Quality Checks
            - [x] HTML validation
            - [x] News indexes regenerated (14 languages)
            - [x] Sitemap updated
            - [ ] Editorial review recommended
            - [ ] Multi-language support verification
            
            ### References
            - Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - MCP Server: riksdag-regering-mcp
            
            ---
            *This PR was automatically created by the news generation workflow*
            
            **Next Steps:**
            1. Review generated articles for accuracy and tone
            2. Verify source citations and links
            3. Check multi-language consistency
            4. Approve and merge if quality standards met
          branch: 'news-generation/automated-${{ github.run_number }}'
          delete-branch: true
          labels: |
            automated-news
            news-generation
            needs-editorial-review
      
      - name: Notify on critical failure
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            
            // Check if errors.json exists and has critical error
            let errorData = null;
            try {
              if (fs.existsSync('news/metadata/errors.json')) {
                const errorContent = fs.readFileSync('news/metadata/errors.json', 'utf8');
                errorData = JSON.parse(errorContent);
              }
            } catch (err) {
              console.log('Could not read errors.json:', err.message);
            }
            
            // Only create issue comment for critical errors
            if (errorData && errorData.lastError && errorData.lastError.severity === 'critical') {
              // Try to find an open issue about news generation failures
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'component:news-generation,type:bug',
                per_page: 1
              });
              
              let issueNumber = null;
              if (issues.data.length > 0) {
                issueNumber = issues.data[0].number;
              }
              
              const commentBody = `🚨 **Critical Failure in News Generation Workflow**
              
              **Error Details:**
              - **Type**: ${errorData.lastError.errorType}
              - **Message**: ${errorData.lastError.message}
              - **Severity**: ${errorData.lastError.severity}
              - **Timestamp**: ${errorData.lastError.timestamp}
              - **Retryable**: ${errorData.lastError.retryable ? 'Yes' : 'No'}
              
              **Workflow Information:**
              - **Workflow**: ${context.workflow}
              - **Run ID**: ${context.runId}
              - **Run URL**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              **Action Required:**
              ${errorData.lastError.errorType === 'script_missing' ? 
                '⚠️ Critical script missing. This requires immediate attention from maintainers.' :
                '⚠️ Workflow failure detected. Please investigate and resolve.'}`;
              
              if (issueNumber) {
                // Comment on existing issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: commentBody
                });
                console.log(`Added comment to issue #${issueNumber}`);
              } else {
                console.log('No open news generation bug issue found - skipping notification');
                console.log(commentBody);
              }
            } else {
              console.log('Non-critical error or no error data - skipping notification');
            }
