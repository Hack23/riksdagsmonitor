name: Deploy to S3
on:
  workflow_dispatch:
    inputs:
      fix_mimetypes:
        description: 'Fix MIME types on ALL existing S3 objects (no build/deploy, only metadata fix)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
  id-token: write
  actions: write

env:
  AWS_REGION : "us-east-1"
  AWS_REGION_ZONE : "us-east-1"
  S3_BUCKET_NAME: "riksdagsmonitor-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "riksdagsmonitor-frontend"
jobs:
  deploy:
    if: ${{ github.event.inputs.fix_mimetypes != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            riksdagsmonitor.com:443
            riksdagsmonitor-frontend-us-east-1-172017021075.s3.us-east-1.amazonaws.com:443
            s3.us-east-1.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            nodejs.org:443
            download.cypress.io:443
            release-assets.githubusercontent.com:443
            cdn.cypress.io:443
            
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Need full history to restore mtimes

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/deploy-s3.yml

      - name: Install dependencies
        run: npm ci

      - name: Guard against broken HTML regressions
        run: |
          echo "🔍 Checking committed news articles for known bad patterns…"
          FAIL=0

          # No raw TypeScript script references in articles
          COUNT=$(grep -rl 'src="[^"]*back-to-top\.ts"' news/ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT article(s) still reference back-to-top.ts"
            grep -rl 'src="[^"]*back-to-top\.ts"' news/ | head -5
            FAIL=1
          fi

          # No non-existent news-article.js references
          COUNT=$(grep -rl 'news-article\.js' news/ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT article(s) still reference news-article.js"
            FAIL=1
          fi

          # No absolute /js/lib/ paths
          COUNT=$(grep -rl 'src="/js/lib/' news/ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT article(s) use absolute /js/lib/ path"
            FAIL=1
          fi

          # No legacy static <script src="…js/theme-toggle.js"> /
          # <script src="…js/back-to-top.js"> tags anywhere in committed
          # HTML. The shared chrome injects both runtimes (plus
          # mermaid-init) dynamically from the footer (see
          # scripts/render-lib/chrome.ts and the inject block written by
          # scripts/strip-legacy-chrome-script-tags.ts). A static tag
          # surviving in any committed page means the sweep did not run
          # during prebuild and Vite will emit thousands of
          # `vite:build-html` "can't be bundled without type=module"
          # warnings on every CI run.
          # Excludes:
          #   - dist/  → build artifact
          #   - node_modules/ → vendored deps
          #   - docs/coverage/, docs/test-results/ → autogenerated
          #     coverage/test reports that may quote source code
          LEGACY_FILES=$(grep -rlE 'src="(\.\./)?js/(theme-toggle|back-to-top)\.js"' \
            --include="*.html" \
            --exclude-dir=dist \
            --exclude-dir=node_modules \
            --exclude-dir=coverage \
            --exclude-dir=test-results \
            . 2>/dev/null || true)
          if [ -n "$LEGACY_FILES" ]; then
            COUNT=$(echo "$LEGACY_FILES" | wc -l)
            echo "❌ $COUNT page(s) still carry legacy <script src=\"…js/theme-toggle.js\"> / back-to-top.js tag"
            echo "$LEGACY_FILES" | head -10
            FAIL=1
          fi

          if [ "$FAIL" -eq 0 ]; then
            echo "✅ No broken HTML patterns found in news articles."
          else
            exit 1
          fi

      - name: Build with Vite
        # The static-pages-emit plugin (scripts/vite-plugin-static-
        # pages.js) keeps the ~3 500 news/*.html, sitemap_*.html and
        # political-intelligence_*.html pages out of Rollup's module
        # graph, so the default Node heap (~4 GB) is more than enough
        # — measured peak ~1 GB on the current corpus.
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Verifying Vite build output..."
          if [ ! -d "dist" ]; then
            echo "❌ Build verification failed: 'dist' directory is missing."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build verification failed: 'dist/index.html' is missing."
            exit 1
          fi

          if [ ! -f "dist/rss.xml" ]; then
            echo "❌ Build verification failed: 'dist/rss.xml' is missing."
            exit 1
          fi

          if [ ! -f "dist/sitemap.xml" ]; then
            echo "❌ Build verification failed: 'dist/sitemap.xml' is missing."
            exit 1
          fi

          if [ ! -f "dist/sitemap.html" ]; then
            echo "❌ Build verification failed: 'dist/sitemap.html' is missing."
            exit 1
          fi

          # Spot-check a representative subset of localized HTML sitemaps
          # (Swedish — primary non-English audience, Arabic — RTL coverage).
          for loc in sitemap_sv.html sitemap_ar.html; do
            if [ ! -f "dist/$loc" ]; then
              echo "❌ Build verification failed: 'dist/$loc' is missing."
              exit 1
            fi
          done

          # Political Intelligence pages (added by PR #1962) must ship to S3.
          # They are explicit Vite inputs — a missing one means the Vite
          # rollupOptions.input list has drifted out of sync with the
          # generator in scripts/generate-political-intelligence.ts.
          if [ ! -f "dist/political-intelligence.html" ]; then
            echo "❌ Build verification failed: 'dist/political-intelligence.html' is missing."
            echo "   Ensure all 14 political-intelligence* entries are listed in vite.config.js rollupOptions.input."
            exit 1
          fi
          for loc in political-intelligence_sv.html political-intelligence_ar.html; do
            if [ ! -f "dist/$loc" ]; then
              echo "❌ Build verification failed: 'dist/$loc' is missing."
              exit 1
            fi
          done

          echo "✅ Build artifacts verified: 'dist' directory, 'dist/index.html', 'dist/rss.xml', 'dist/sitemap.xml', HTML sitemaps, and political-intelligence pages exist."

          if [ ! -d "dist/news" ]; then
            echo "❌ Build verification failed: 'dist/news/' directory is missing."
            exit 1
          fi
          echo "✅ dist/news/ directory present."

          # Dashboard pages (added by PR #2349) must exist AND contain the
          # hashed Vite bundle.  The dev-only `/src/browser/main.ts` path
          # 404s on S3 (CloudFront serves index.html for unknown paths
          # with text/html), so the browser silently rejects it as a JS
          # module → lazy loader never runs → all charts empty.
          DASH_FAIL=0
          for slug in parties pre-election coalitions committees seasonal-patterns anomaly-detection risk ministers election-cycle; do
            f="dist/dashboards/${slug}.html"
            if [ ! -f "$f" ]; then
              echo "❌ Dashboard missing: $f"
              DASH_FAIL=1
              continue
            fi
            if grep -q '/src/browser/main.ts' "$f"; then
              echo "❌ $f still references dev-only /src/browser/main.ts"
              DASH_FAIL=1
            fi
            if ! grep -qE 'src="/assets/js/main-[A-Za-z0-9_-]+\.js"' "$f"; then
              echo "❌ $f missing hashed main-*.js bundle"
              DASH_FAIL=1
            fi
          done
          if [ "$DASH_FAIL" -eq 0 ]; then
            echo "✅ All 9 dashboard pages verified: hashed bundle present, no dev paths."
          else
            echo "❌ Dashboard verification failed — aborting deploy."
            exit 1
          fi

          # CIA data directory must exist (CSV data for dashboards)
          if [ ! -d "dist/cia-data" ]; then
            echo "❌ Build verification failed: 'dist/cia-data/' directory is missing."
            exit 1
          fi
          echo "✅ dist/cia-data/ directory present."

      - name: Copy documentation to build output
        run: |
          if [ -d "docs" ]; then
            echo "📚 Copying documentation to dist/docs/..."
            cp -r docs dist/docs
            echo "✅ Documentation copied to dist/docs/"
          else
            echo "ℹ️ No docs directory found, skipping"
          fi

      - name: Copy JS libraries to build output
        run: |
          echo "📦 Copying js/ directory to dist/js/..."
          # The js/ directory contains utility scripts (theme-init.js,
          # theme-toggle.js, back-to-top.js, chart-init.js) and vendor
          # libraries (js/lib/chart.umd.*.js, d3, papaparse, etc.) that
          # are referenced by news articles and dashboard pages via
          # relative paths (../js/lib/chart.umd.4.4.1.js).
          # Vite also copies public/js/ to dist/js/. We merge js/ ON TOP
          # with `cp -r` (force-overwrite) so the repository-canonical
          # js/* sources are the single source of truth in dist/. The
          # earlier `cp -rn` (no-clobber) caused stale public/js/*.js to
          # win over newer js/*.js, breaking the theme switcher on every
          # page that loads /js/theme-toggle.js dynamically.
          if [ -d "js" ]; then
            cp -r js/* dist/js/
            echo "✅ JS directory merged into dist/js/ (js/ takes precedence)"
            echo "  Files in dist/js/:"
            find dist/js -type f | sort
          else
            echo "⚠️  No js/ directory found — skipping"
          fi

      # ── Pre-deploy assertion: Mermaid runtime is staged in dist ───
      # Articles embed Mermaid diagrams via an inline bootstrap that
      # dynamic-imports `/js/lib/mermaid-init.mjs`, which in turn
      # dynamic-imports `/js/lib/mermaid/mermaid.esm.min.mjs`, which
      # statically imports ~80 chunk files under
      # `/js/lib/mermaid/chunks/mermaid.esm.min/`. If ANY chunk is
      # missing on S3 the browser fails the whole module graph with
      # `Failed to fetch dynamically imported module: …mermaid.esm.min.mjs`
      # and every diagram on the page silently disappears.
      #
      # Fail the deploy here (BEFORE invoking aws s3 sync) if the
      # mermaid runtime is incomplete — this surfaces a broken vendor
      # copy at build time rather than after publishing to production.
      - name: Verify Mermaid runtime is staged in dist
        run: |
          set -euo pipefail
          ENTRY="dist/js/lib/mermaid/mermaid.esm.min.mjs"
          CHUNKS_DIR="dist/js/lib/mermaid/chunks/mermaid.esm.min"
          if [ ! -f "$ENTRY" ]; then
            echo "❌ Missing Mermaid entry point: $ENTRY"
            echo "   Did scripts/copy-vendor-mermaid.ts run during prebuild?"
            exit 1
          fi
          if [ ! -d "$CHUNKS_DIR" ]; then
            echo "❌ Missing Mermaid chunks directory: $CHUNKS_DIR"
            exit 1
          fi
          CHUNK_COUNT=$(find "$CHUNKS_DIR" -name '*.mjs' -type f | wc -l)
          # Mermaid 11.x ships ~80 chunk files. Anything below 50 means
          # the vendor copy is incomplete (partial extraction, wrong
          # version, or a path mismatch in copy-vendor-mermaid.ts).
          MIN_CHUNKS=50
          if [ "$CHUNK_COUNT" -lt "$MIN_CHUNKS" ]; then
            echo "❌ Mermaid chunks directory has only $CHUNK_COUNT .mjs files (expected ≥$MIN_CHUNKS)"
            ls -la "$CHUNKS_DIR" | head -20
            exit 1
          fi
          echo "✅ Mermaid runtime OK: entry + $CHUNK_COUNT chunks staged in dist/"

      # ── Bake CIA stats into start-page HTML ───────────────────────
      # Replaces every `<span data-stat-id="stat-…">PLACEHOLDER</span>`
      # in `dist/index*.html` with the real value parsed from
      # `cia-data/extraction_summary_report.csv`. This eliminates the
      # runtime CSV fetch + DOM rewrite that `src/browser/main.ts`
      # would otherwise perform on every navigation to the start page
      # (saves ≈ 15 KiB CSV + parse + N DOM writes — directly improves
      # TBT and lets the browser focus on FCP/LCP of the hero banner).
      #
      # Runs AFTER docs/ and js/ copy so dist is otherwise complete,
      # and BEFORE PurgeCSS so PurgeCSS does not need to keep selectors
      # that only existed for the runtime path. Idempotent — pages
      # whose placeholders are already concrete numbers are no-ops.
      - name: Bake CIA stats into start-page HTML
        run: npx tsx scripts/bake-stats-html.ts dist cia-data/extraction_summary_report.csv

      # ── HTML / CSS / JS minification ─────────────────────────────
      # Run the `minify` (coderaiser/minify) package directly on the
      # runner host — no Docker, no apt-get, no workspace staging.
      # Minifies every .html / .css / .js / .mjs under dist/ in place.
      # Filenames are preserved so CloudFront origin paths and per-page
      # <link>/<script> references all keep working unchanged.
      #
      # Note: this pipeline used to include a `Purge unused CSS` step
      # (PurgeCSS against `dist/assets/styles.css`). That was removed
      # — the source `styles.css` is now the single source of truth
      # and is kept free of dead selectors at commit time. Adding the
      # deploy-time purger back would mask new dead CSS rather than
      # surface it in code review.
      #
      # No SRI re-stamping step follows: `vite-plugin-sri-gen` was
      # removed (vite.config.js) and `vite-plugin-static-pages.js`
      # no longer injects `integrity` attributes onto first-party
      # `<link>`/`<script>` tags. All assets are served from the
      # Hack23-owned S3 → CloudFront pipeline; integrity is enforced
      # by TLS + bucket policy + WAF rather than browser-side SRI.
      - name: Minify HTML/CSS/JS
        run: npx tsx scripts/minify-dist.ts dist

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to S3 with cache headers
        run: bash scripts/deploy-s3.sh dist "s3://${{ env.S3_BUCKET_NAME }}"
      
      # Invalidate CloudFront cache to ensure latest content is served
      # Note: Using blanket "/*" invalidation is optimal for this use case:
      # - Site has ~500 files (well within 1000 free invalidations/month)
      # - Deployment frequency is low (PR-based, not continuous)
      # - Simplicity trumps optimization at this scale
      # - Cache headers already optimized (1hr HTML, 1yr assets, 24hr metadata)
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."

          # Capture the invalidation ID and (synchronously) wait for it
          # to reach Completed before the verify step probes CloudFront —
          # otherwise the previous behaviour was to fire-and-forget,
          # then race the verify against an in-progress invalidation,
          # producing spurious 4xx from stale CF cache.
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CloudFrontDistId" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation ID: $INVALIDATION_ID — waiting for completion…"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CloudFrontDistId" \
            --id "$INVALIDATION_ID"
          echo "✅ CloudFront cache invalidation completed"

      # ── Post-deploy verification: Mermaid runtime is reachable ────
      # The browser console error
      #   `Failed to fetch dynamically imported module:
      #    https://riksdagsmonitor.com/js/lib/mermaid/mermaid.esm.min.mjs`
      # is reported against the top-level URL, but the actual failure
      # is usually a NESTED chunk file under
      # `/js/lib/mermaid/chunks/mermaid.esm.min/` returning 403 —
      # browsers attribute the rejection to the parent module of the
      # dynamic-import promise.
      #
      # Verify against the production domain (CloudFront) — NOT the raw
      # S3 bucket URL (which returns 403 due to Origin Access Control
      # restricting direct access). This mirrors what real browsers fetch.
      # Includes retry logic since CloudFront invalidation is async.
      - name: Verify Mermaid runtime is reachable on production domain
        run: |
          set -euo pipefail
          # Verify via the real production domain (CloudFront) — NOT the raw
          # S3 bucket URL (which returns 403 due to OAC restricting direct
          # access). This is what browsers actually hit.
          SITE_URL="https://riksdagsmonitor.com"
          INIT_KEY="js/lib/mermaid-init.mjs"
          ENTRY_KEY="js/lib/mermaid/mermaid.esm.min.mjs"
          # Pick the first staged chunk as a representative probe.
          FIRST_CHUNK_PATH=$(find dist/js/lib/mermaid/chunks/mermaid.esm.min -maxdepth 1 -name '*.mjs' -type f | sort | head -n 1)
          if [ -z "$FIRST_CHUNK_PATH" ]; then
            echo "❌ No staged chunk found to probe — vendor copy missing?"
            exit 1
          fi
          CHUNK_KEY="js/lib/mermaid/chunks/mermaid.esm.min/$(basename "$FIRST_CHUNK_PATH")"

          # CloudFront invalidation is async — retry with exponential backoff
          # (up to ~60s total) to allow propagation after the invalidation
          # request sent in the previous step.
          MAX_RETRIES=4
          for KEY in "$INIT_KEY" "$ENTRY_KEY" "$CHUNK_KEY"; do
            URL="$SITE_URL/$KEY"
            success=0
            for attempt in $(seq 1 $MAX_RETRIES); do
              STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo "000")
              CT=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 30 "$URL" || echo "")
              if [ "$STATUS" = "200" ]; then
                echo "✅ $STATUS  $URL  (content-type: $CT)"
                success=1
                break
              fi
              WAIT=$((5 * attempt))
              echo "⏳ Attempt $attempt/$MAX_RETRIES: $STATUS for $URL — retrying in ${WAIT}s..."
              sleep "$WAIT"
            done
            if [ "$success" != "1" ]; then
              echo "❌ $STATUS  $URL  (content-type: $CT)"
              echo ""
              echo "Mermaid runtime is NOT reachable on production domain after $MAX_RETRIES retries."
              echo "Articles that embed Mermaid diagrams will fail to render with"
              echo "  'Failed to fetch dynamically imported module: …mermaid.esm.min.mjs'"
              echo "in the browser console."
              echo ""
              echo "Troubleshooting:"
              echo "  1. Check CloudFront invalidation completed"
              echo "  2. Verify S3 objects exist: aws s3 ls s3://${{ env.S3_BUCKET_NAME }}/$KEY"
              echo "  3. Verify content-type: aws s3api head-object --bucket ${{ env.S3_BUCKET_NAME }} --key $KEY"
              exit 1
            fi
          done

  # ── Fix MIME types on existing S3 objects (manual trigger only) ──
  fix-mimetypes:
    if: ${{ github.event.inputs.fix_mimetypes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            riksdagsmonitor-frontend-us-east-1-172017021075.s3.us-east-1.amazonaws.com:443
            s3.us-east-1.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            cloudformation.us-east-1.amazonaws.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/fix-s3-mimetypes.sh
          sparse-checkout-cone-mode: false

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}

      - name: Fix MIME types on all S3 objects
        run: bash scripts/fix-s3-mimetypes.sh "s3://${{ env.S3_BUCKET_NAME }}"

      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed after MIME type fix"
