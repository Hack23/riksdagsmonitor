name: Deploy
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: write

env:
  AWS_REGION : "us-east-1"
  AWS_REGION_ZONE : "us-east-1"
  S3_BUCKET_NAME: "riksdagsmonitor-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "riksdagsmonitor-frontend"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: block
          allowed-endpoints: >
            accounts.google.com:443
            amazon-cloudfront-secure-static-site-s3bucketroot-14oliw5cmta06.s3.us-east-1.amazonaws.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            app.fossa.io:443
            auth.docker.io:443
            bestpractices.coreinfrastructure.org:443
            cfu.zaproxy.org:443
            cla-assistant.io:443
            cla-assistant.io:80
            clients2.google.com:80
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            content-signature-2.cdn.mozilla.net:443
            deb.debian.org:80
            firefox-settings-attachments.cdn.mozilla.net:443
            firefox.settings.services.mozilla.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            hack23.com:443
            hack23.com:80
            hack23.comnull:443
            img.shields.io:443
            isitmaintained.com:443
            isitmaintained.com:80
            location.services.mozilla.com:443
            news.zaproxy.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            r10.o.lencr.org:443
            r11.o.lencr.org:80
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            safebrowsingohttpgateway.googleapis.com:443
            shavar.services.mozilla.com:443
            slsa.dev:443
            sonarcloud.io:443
            storage.googleapis.com:443
            sts.us-east-1.amazonaws.com:443
            tel.zaproxy.org:443
            tracking-protection.cdn.mozilla.net:443
            us-central1-lighthouse-infrastructure.cloudfunctions.net:443
            www.google.com:443
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Need full history to restore mtimes

      - name: Restore file modification times from git
        run: |
          # Restore mtimes to git commit time for accurate change detection
          # This prevents re-uploading all files on every deployment
          git ls-tree -r --name-only HEAD | while read filename; do
            TIME=$(git log -1 --format="%ai" -- "$filename")
            touch -d "$TIME" "$filename"
          done
          echo "✅ Restored mtimes for $(git ls-tree -r --name-only HEAD | wc -l) files"

      - name: Cache apt packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache npm dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-minify-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-minify-
            ${{ runner.os }}-npm-

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to S3 with proper cache headers
        run: |
          echo "🚀 Starting S3 deployment with optimized cache headers..."
          
          # Sync JS files with immutable cache (1 year)
          echo "⚡ Syncing JavaScript files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.js" \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --cache-control "public, max-age=31536000, immutable"
          
          # Sync CSS files with immutable cache (1 year)
          echo "🎨 Syncing CSS files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.css" \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --cache-control "public, max-age=31536000, immutable"
          
          # Sync font files with immutable cache (1 year)
          echo "🔤 Syncing font files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.woff" \
            --include "*.woff2" \
            --include "*.ttf" \
            --include "*.eot" \
            --include "*.otf" \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --cache-control "public, max-age=31536000, immutable"
          
          # Sync image files with immutable cache (1 year)
          echo "🖼️  Syncing image files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.webp" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --cache-control "public, max-age=31536000, immutable"
          
          # Sync HTML files with short cache (1 hour)
          echo "📄 Syncing HTML files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --cache-control "public, max-age=3600, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          
          # Sync metadata files with medium cache (1 day)
          echo "📋 Syncing metadata files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.xml" \
            --include "*.json" \
            --include "*.txt" \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --cache-control "public, max-age=86400"
          
          # Sync all remaining files (catch-all for CNAME, robots.txt, etc.)
          echo "📦 Syncing remaining files..."
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude ".git/*" \
            --exclude "screenshots/*" \
            --exclude ".github/*" \
            --exclude "docs/*" \
            --exclude "schemas/*" \
            --exclude "scripts/*" \
            --exclude ".devcontainer/*" \
            --exclude "quicksight/*" \
            --exclude "*.md" \
            --exclude "package*.json" \
            --exclude ".gitignore" \
            --exclude "*.js" \
            --exclude "*.css" \
            --exclude "*.woff" \
            --exclude "*.woff2" \
            --exclude "*.ttf" \
            --exclude "*.eot" \
            --exclude "*.otf" \
            --exclude "*.webp" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.gif" \
            --exclude "*.svg" \
            --exclude "*.ico" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.json" \
            --exclude "*.txt"
          
          echo "✅ S3 deployment completed with optimized cache headers"
          echo "ℹ️  Internal directories (.github/, docs/, schemas/, scripts/) excluded from deployment"
          echo "ℹ️  Files synced based on git mtime + size for accurate change detection"
      
      # Invalidate CloudFront cache to ensure latest content is served
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed"
